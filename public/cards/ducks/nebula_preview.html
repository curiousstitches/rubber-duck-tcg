<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nebula — preview</title><style>
body{margin:0;background:#070910;color:#e8ebf5;font-family:system-ui,sans-serif;
display:flex;flex-direction:column;align-items:center;justify-content:center;
min-height:100vh;gap:14px;padding:18px}
.tag{color:#8f98b8;font-size:.82rem;text-align:center;max-width:400px}
button{background:#2b3457;color:#fff;border:0;border-radius:10px;padding:11px 18px;
font:700 .9rem system-ui;}

.dwrap{perspective:1100px;width:min(88vw,430px);touch-action:pan-y}
.dcard{position:relative;width:100%;aspect-ratio:5/7;border-radius:18px;overflow:hidden;
 background:#0a0d18;isolation:isolate;transform-style:preserve-3d;
 transform:rotateY(calc(var(--tx,0)*11deg)) rotateX(calc(var(--ty,0)*-8deg));
 transition:transform .12s ease-out;box-shadow:0 14px 44px rgba(0,0,0,.65)}
.dstage{position:absolute;left:0;right:0;top:8.5%;height:63%;overflow:hidden;
 border-radius:8px;margin:0 5.5%}
.dstage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
 will-change:transform}
.dstage .bg{transform:scale(1.12) translateX(calc(var(--tx,0)*-2.2%));
 animation:bgdrift 22s ease-in-out infinite}
@keyframes bgdrift{0%,100%{transform:scale(1.12) translateX(0)}50%{transform:scale(1.16) translateX(-2%)}}
.dstage .lay{object-fit:contain}
.dstage .weap{width:38%;height:auto;left:4%;top:26%;object-fit:contain;
 transform-origin:50% 86%;filter:drop-shadow(0 4px 9px rgba(0,0,0,.55))}

/* ---------- personality motion presets ---------- */
.p-aggro .body{animation:aggroBody var(--cyc) cubic-bezier(.5,0,.2,1) infinite}
.p-aggro .head{animation:aggroHead var(--cyc) cubic-bezier(.5,0,.2,1) infinite}
.p-aggro .wing{animation:aggroWing var(--cyc) ease-in-out infinite}
@keyframes aggroBody{0%,38%{transform:translateX(0) scale(1)}
 48%{transform:translateX(-3%) scale(.97,1.03)}58%{transform:translateX(5%) scale(1.05,.95)}
 74%{transform:translateX(0) scale(1)}100%{transform:translateX(0) scale(1)}}
@keyframes aggroHead{0%,38%{transform:rotate(0)}48%{transform:rotate(-9deg)}
 58%{transform:rotate(11deg)}74%{transform:rotate(0)}100%{transform:rotate(0)}}
@keyframes aggroWing{0%,40%{transform:rotate(0)}52%{transform:rotate(-26deg)}
 66%{transform:rotate(8deg)}80%{transform:rotate(0)}100%{transform:rotate(0)}}

.p-serene .body{animation:sereneBody var(--cyc) ease-in-out infinite}
.p-serene .head{animation:sereneHead var(--cyc) ease-in-out infinite}
.p-serene .wing{animation:sereneWing var(--cyc) ease-in-out infinite}
@keyframes sereneBody{0%,100%{transform:translateY(0) scale(1)}
 50%{transform:translateY(-2.2%) scale(1.015)}}
@keyframes sereneHead{0%,100%{transform:translateY(0) rotate(-1.5deg)}
 50%{transform:translateY(-3.4%) rotate(2deg)}}
@keyframes sereneWing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(6deg)}}

.p-erratic .body{animation:errBody var(--cyc) steps(1,end) infinite}
.p-erratic .head{animation:errHead var(--cyc) ease-out infinite}
.p-erratic .wing{animation:errWing calc(var(--cyc)/2) ease-in-out infinite}
@keyframes errBody{0%,44%{transform:translate(0,0)}46%{transform:translate(-1.4%,.8%)}
 48%{transform:translate(1.4%,-.8%)}50%{transform:translate(-1%,0)}54%{transform:translate(0,0)}
 100%{transform:translate(0,0)}}
@keyframes errHead{0%,44%{transform:rotate(0)}50%{transform:rotate(-13deg)}
 60%{transform:rotate(5deg)}72%{transform:rotate(0)}100%{transform:rotate(0)}}
@keyframes errWing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}

.p-sway .body{animation:swayBody var(--cyc) ease-in-out infinite}
.p-sway .head{animation:swayHead var(--cyc) ease-in-out infinite}
.p-sway .wing{animation:swayWing var(--cyc) ease-in-out infinite}
@keyframes swayBody{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes swayHead{0%,100%{transform:rotate(2.4deg) translateY(0)}
 50%{transform:rotate(-2.4deg) translateY(-2%)}}
@keyframes swayWing{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-9deg)}}

.p-levitate .body{animation:levBody var(--cyc) ease-in-out infinite}
.p-levitate .head{animation:levHead var(--cyc) ease-in-out infinite}
.p-levitate .wing{animation:levWing var(--cyc) ease-in-out infinite}
@keyframes levBody{0%,100%{transform:translateY(0) rotate(-1deg)}
 50%{transform:translateY(-5%) rotate(1deg)}}
@keyframes levHead{0%,100%{transform:translateY(0)}50%{transform:translateY(-6.5%)}}
@keyframes levWing{0%,100%{transform:rotate(-6deg) translateY(0)}
 50%{transform:rotate(10deg) translateY(-4%)}}

.p-bouncy .body{animation:bncBody var(--cyc) cubic-bezier(.3,1.5,.5,1) infinite}
.p-bouncy .head{animation:bncHead var(--cyc) cubic-bezier(.3,1.5,.5,1) infinite}
.p-bouncy .wing{animation:bncWing calc(var(--cyc)/2) ease-in-out infinite}
@keyframes bncBody{0%,100%{transform:translateY(0) scale(1,1)}
 40%{transform:translateY(-7%) scale(.95,1.06)}62%{transform:translateY(0) scale(1.07,.94)}
 78%{transform:translateY(-1.5%) scale(1,1)}}
@keyframes bncHead{0%,100%{transform:translateY(0) rotate(0)}
 40%{transform:translateY(-9%) rotate(-6deg)}62%{transform:translateY(1%) rotate(5deg)}}
@keyframes bncWing{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(18deg)}}

.p-ranged .body{animation:rngBody var(--cyc) ease-out infinite}
.p-ranged .head{animation:rngHead var(--cyc) ease-out infinite}
.p-ranged .wing{animation:rngWing var(--cyc) ease-in-out infinite}
@keyframes rngBody{0%,50%{transform:translateX(0)}56%{transform:translateX(4%)}
 72%{transform:translateX(0)}100%{transform:translateX(0)}}
@keyframes rngHead{0%,50%{transform:rotate(0)}56%{transform:rotate(5deg)}
 70%{transform:rotate(-2deg)}82%{transform:rotate(0)}100%{transform:rotate(0)}}
@keyframes rngWing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}

/* whole-duck fallback (when the cut didn't pass QC) */
.mode-whole .duck{animation:wholeBob var(--cyc) ease-in-out infinite}
@keyframes wholeBob{0%,100%{transform:translateY(0) scale(1)}
 50%{transform:translateY(-2.4%) scale(1.02)}}

/* ---------- weapon motion ---------- */
.weap.swing{animation:wswing var(--cyc) cubic-bezier(.5,0,.2,1) infinite}
.weap.thrust{animation:wthrust var(--cyc) cubic-bezier(.5,0,.2,1) infinite}
.weap.recoil{animation:wrecoil var(--cyc) ease-out infinite}
.weap.throw{animation:wthrow var(--cyc) ease-in-out infinite}
.weap.float{animation:wfloat var(--cyc) ease-in-out infinite}
@keyframes wswing{0%,40%{transform:rotate(-24deg)}54%{transform:rotate(44deg)}
 72%{transform:rotate(-12deg)}100%{transform:rotate(-24deg)}}
@keyframes wthrust{0%,44%{transform:translate(0,0)}56%{transform:translate(-24%,-5%)}
 74%{transform:translate(0,0)}100%{transform:translate(0,0)}}
@keyframes wrecoil{0%,50%{transform:translate(0,0)}56%{transform:translate(13%,0)}
 72%{transform:translate(0,0)}100%{transform:translate(0,0)}}
@keyframes wthrow{0%,40%{transform:translate(0,0) rotate(0)}
 62%{transform:translate(-140%,-16%) rotate(380deg)}
 88%{transform:translate(0,0) rotate(720deg)}100%{transform:translate(0,0) rotate(720deg)}}
@keyframes wfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8%)}}

/* ---------- particles ---------- */
.sparks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sp{position:absolute;border-radius:50%;opacity:0}
@keyframes sprise{0%{opacity:0;transform:translateY(0)}18%{opacity:.9}
 100%{opacity:0;transform:translateY(-260px)}}
@keyframes spfall{0%{opacity:.9;transform:translateY(0)}100%{opacity:0;transform:translateY(320px)}}
@keyframes sptwinkle{0%,100%{opacity:.12}50%{opacity:1}}
@keyframes spflash{0%,54%{opacity:0}58%{opacity:.65}64%{opacity:0}100%{opacity:0}}

/* ---------- PRINT-READY HOLO ZONES (tilt-reactive, not auto-looping) ---------- */
.foilzone{position:relative;isolation:isolate;overflow:hidden}
.foilzone::after{content:"";position:absolute;inset:0;pointer-events:none;
 mix-blend-mode:color-dodge;opacity:var(--foil,.5);
 background:linear-gradient(115deg,transparent 26%,#00e5ff 36%,#ffffff 44%,
  #ff4ecd 52%,#ffe74e 60%,#4effa1 68%,transparent 78%);
 background-size:300% 300%;
 background-position:calc(50% + var(--tx,0)*46%) calc(50% + var(--ty,0)*46%);
 transition:background-position .1s linear}
.dframe{position:absolute;inset:0;border-radius:18px;pointer-events:none;
 border:var(--fw,7px) solid #1a2036}
.dframe::after{content:"";position:absolute;inset:0;border-radius:12px;
 pointer-events:none;mix-blend-mode:color-dodge;opacity:var(--foil,.5);
 border:var(--fw,7px) solid transparent;
 background:linear-gradient(115deg,transparent 24%,#00e5ff 34%,#fff 43%,#ff4ecd 51%,
  #ffe74e 59%,#4effa1 68%,transparent 80%) border-box;
 background-size:300% 300%;
 background-position:calc(50% + var(--tx,0)*46%) calc(50% + var(--ty,0)*46%);
 -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);
 -webkit-mask-composite:xor;mask-composite:exclude;
 transition:background-position .1s linear}
.dname{position:absolute;left:5.5%;right:5.5%;top:2.2%;height:5.6%;border-radius:8px;
 background:#141a2e;display:flex;align-items:center;justify-content:center;
 font:800 clamp(.8rem,4.1vw,1.25rem)/1 system-ui,sans-serif;color:#fff;
 text-transform:uppercase;letter-spacing:.06em;border:2px solid #2b3457}
.dstats{position:absolute;left:5.5%;right:5.5%;top:73%;height:7%;border-radius:8px;
 background:#131829;display:flex;align-items:center;justify-content:space-around;
 font:800 clamp(.68rem,3.3vw,1rem)/1 system-ui,sans-serif;color:#dfe6ff;
 border:2px solid #262f52}
.dstars{position:absolute;left:5.5%;top:81.4%;height:5.4%;padding:0 10px;border-radius:8px;
 background:#131829;display:flex;align-items:center;
 font:800 clamp(.72rem,3.4vw,1.05rem)/1 system-ui,sans-serif;color:#ffd977;
 letter-spacing:.12em;border:2px solid #262f52}
.dmove{position:absolute;left:5.5%;right:5.5%;top:88%;height:8.4%;border-radius:8px;
 background:#101527;padding:5px 10px;border:2px solid #262f52;
 display:flex;flex-direction:column;justify-content:center;gap:2px}
.dmove b{font:800 clamp(.66rem,3.1vw,.95rem)/1 system-ui,sans-serif;color:#fff}
.dmove span{font:600 clamp(.6rem,2.8vw,.85rem)/1 system-ui,sans-serif;color:#ffd977}

<div class="tag">Drag across the card with your finger — the foil on the frame,
name, stars, stats and move box should shift like real holographic stock.</div>
<script>
(function(){
  function bind(wrap){
    if(wrap.dataset.tilt) return; wrap.dataset.tilt="1";
    var card=wrap.querySelector('.dcard'); if(!card) return;
    function set(x,y){
      card.style.setProperty('--tx',Math.max(-1,Math.min(1,x)).toFixed(3));
      card.style.setProperty('--ty',Math.max(-1,Math.min(1,y)).toFixed(3));
    }
    var dragging=false;
    wrap.addEventListener('pointerdown',function(e){dragging=true;wrap.setPointerCapture(e.pointerId);});
    wrap.addEventListener('pointerup',function(){dragging=false;set(0,0);});
    wrap.addEventListener('pointercancel',function(){dragging=false;set(0,0);});
    wrap.addEventListener('pointermove',function(e){
      var r=wrap.getBoundingClientRect();
      var x=((e.clientX-r.left)/r.width-.5)*2, y=((e.clientY-r.top)/r.height-.5)*2;
      if(dragging||e.pointerType==='mouse') set(x,y);
    });
    wrap._tiltSet=set;
  }
  window.bindTilt=bind;
  var gyroOn=false;
  window.enableGyro=function(){
    function handle(ev){
      var g=(ev.gamma||0)/32, b=((ev.beta||0)-42)/32;
      document.querySelectorAll('.dwrap').forEach(function(w){ if(w._tiltSet) w._tiltSet(g,b); });
    }
    function start(){ window.addEventListener('deviceorientation',handle); gyroOn=true; }
    if(typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission){
      DeviceOrientationEvent.requestPermission().then(function(s){ if(s==='granted') start(); });
    } else { start(); }
    return true;
  };
})();

document.querySelectorAll('.dwrap').forEach(bindTilt);</script>
