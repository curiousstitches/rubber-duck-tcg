<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>Card Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
.dwrap{perspective:1000px;width:min(88vw,420px);touch-action:pan-y;
 padding:14% 12% 12%;margin:-14% -12% -12%}
/* 3D stage — the card and the pop-out share this space but the orb is NOT clipped */
.dscene{position:relative;width:100%;aspect-ratio:5/7;transform-style:preserve-3d;
 transform:rotateY(calc(var(--tx,0)*13deg)) rotateX(calc(var(--ty,0)*-10deg));
 will-change:transform}
.dcard{position:relative;width:100%;height:100%;border-radius:20px;overflow:hidden;
 background:#0c0f1b;isolation:isolate;
 box-shadow:0 16px 46px rgba(0,0,0,.7)}
.dart{position:absolute;left:5.5%;right:5.5%;top:9%;height:62%;border-radius:10px;
 overflow:hidden;border:2px solid #28325a}
.dart img{width:100%;height:100%;object-fit:cover;display:block;
 transform:scale(1.06) translate(calc(var(--tx,0)*-1.6%),calc(var(--ty,0)*-1.6%));
 will-change:transform}
.foilzone{position:relative;isolation:isolate;overflow:hidden;
 box-shadow:0 0 calc(7px + var(--neon,6px)) var(--gcol,#00fff2),
            0 0 calc(18px + var(--neon,6px)) rgba(255,67,224,.35)}
/* themed colour wash */
.foilzone::after{content:"";position:absolute;inset:0;pointer-events:none;
 mix-blend-mode:color-dodge;opacity:var(--foil,.6);
 background:var(--wash);
 background-size:340% 340%;filter:saturate(1.9) brightness(1.5);
 background-position:calc(50% + var(--tx,0)*54%) calc(50% + var(--ty,0)*54%)}
/* diamond lattice texture layer */
.foilzone .lattice{position:absolute;inset:0;pointer-events:none;z-index:2;
 mix-blend-mode:color-dodge;opacity:calc(var(--foil,.6)*.95);
 background:var(--pat);background-size:var(--patsize,22px) var(--patsize,22px);
 background-position:calc(var(--tx,0)*14px) calc(var(--ty,0)*14px);
 filter:saturate(1.7) brightness(1.5)}
.foilzone::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
 mix-blend-mode:screen;opacity:calc(var(--foil,.6)*.75);
 background:linear-gradient(100deg,transparent 41%,rgba(255,255,255,.95) 49%,
  rgba(150,255,255,.8) 53%,transparent 61%);
 background-size:300% 300%;
 background-position:calc(50% + var(--tx,0)*76%) calc(50% + var(--ty,0)*76%);
 animation:neonStreak calc(var(--shim,6s)) linear infinite}
@keyframes neonStreak{0%{transform:translateX(-13%)}100%{transform:translateX(13%)}}
.dframe{position:absolute;inset:0;border-radius:20px;pointer-events:none;
 border:var(--fw,8px) solid #151b31}
.dframe::after{content:"";position:absolute;inset:0;border-radius:13px;pointer-events:none;
 mix-blend-mode:color-dodge;opacity:calc(var(--foil,.6)*1.18);
 border:var(--fw,8px) solid transparent;
 background:var(--wash) border-box;
 background-size:340% 340%;filter:saturate(2.0) brightness(1.6);
 background-position:calc(50% + var(--tx,0)*54%) calc(50% + var(--ty,0)*54%);
 -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);
 -webkit-mask-composite:xor;mask-composite:exclude}
.dframe::before{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;
 box-shadow:0 0 calc(11px + var(--neon,6px)) var(--gcol,#00fff2),
            0 0 calc(28px + var(--neon,6px)*2) rgba(255,67,224,.35),
            inset 0 0 calc(9px + var(--neon,6px)) rgba(130,255,255,.32);
 animation:neonPulse calc(var(--shim,6s)*.85) ease-in-out infinite}
@keyframes neonPulse{0%,100%{opacity:.7}50%{opacity:1}}

/* ============ EDGE-LIGHT SYSTEM ============
   No objects sit on the art. Instead a travelling light traces the
   linework — the art window border, the frame, and the foil zones —
   with a pulse rhythm matched to each duck's weapon. */

/* travelling light around the art window */
.ringmask{position:absolute;inset:0;border-radius:10px;pointer-events:none;
 border:2px solid transparent;overflow:hidden;
 -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);
 -webkit-mask-composite:xor;mask-composite:exclude;
 opacity:var(--edge,.85)}
.ringmask .tracer{position:absolute;inset:-60%;
 background:conic-gradient(from 0deg,transparent 0 62%,var(--o3) 72%,
  var(--o1) 80%,#ffffff 85%,var(--o1) 90%,var(--o2) 95%,transparent 100%);
 filter:saturate(1.6) brightness(1.35);
 animation:traceSpin var(--ocyc,4s) linear infinite}
@keyframes traceSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}

/* second, slower counter-tracer for depth */
.ringmask.slow{border-width:1px;opacity:calc(var(--edge,.85)*.55)}
.ringmask.slow .tracer{animation-duration:calc(var(--ocyc,4s)*2.1);
 animation-direction:reverse}

/* inner rim glow that breathes with the duck's rhythm */
.rimlight{position:absolute;inset:0;border-radius:10px;pointer-events:none;
 box-shadow:inset 0 0 calc(9px + var(--neon,6px)) var(--o1),
            inset 0 0 calc(22px + var(--neon,6px)) var(--o2);
 opacity:0;mix-blend-mode:screen}

/* ---- per-weapon pulse rhythm (opacity only — nothing covers the art) ---- */
.pr-cradle .rimlight   {animation:rhCradle  var(--ocyc) ease-in-out infinite}
.pr-swing .rimlight,
.pr-chop .rimlight,
.pr-reap .rimlight     {animation:rhSwing   var(--ocyc) cubic-bezier(.5,0,.2,1) infinite}
.pr-draw-slash .rimlight{animation:rhDrawSlash var(--ocyc) cubic-bezier(.7,0,.2,1) infinite}
.pr-thrust .rimlight,
.pr-bash .rimlight,
.pr-jab .rimlight      {animation:rhThrust  var(--ocyc) cubic-bezier(.5,0,.15,1) infinite}
.pr-slam .rimlight,
.pr-bonk .rimlight     {animation:rhSlam    var(--ocyc) cubic-bezier(.4,0,.1,1) infinite}
.pr-lash .rimlight,
.pr-whirl .rimlight    {animation:rhLash    var(--ocyc) ease-in-out infinite}
.pr-flurry .rimlight   {animation:rhFlurry  calc(var(--ocyc)*.5) ease-in-out infinite}
.pr-beamswing .rimlight{animation:rhSwing   var(--ocyc) cubic-bezier(.5,0,.2,1) infinite}
.pr-fire-burst .rimlight,
.pr-charge-fire .rimlight,
.pr-click-fire .rimlight{animation:rhFire   var(--ocyc) ease-out infinite}
.pr-fire-reload .rimlight{animation:rhReload var(--ocyc) ease-out infinite}
.pr-spray .rimlight    {animation:rhSpray   var(--ocyc) ease-in-out infinite}
.pr-pull-release .rimlight,
.pr-draw-loose .rimlight{animation:rhDraw   var(--ocyc) ease-out infinite}
.pr-pop .rimlight,
.pr-honk .rimlight     {animation:rhPop     var(--ocyc) ease-out infinite}
.pr-throw-return .rimlight,
.pr-hook-pull .rimlight{animation:rhThrow   var(--ocyc) ease-in-out infinite}
.pr-yo .rimlight       {animation:rhYo      var(--ocyc) cubic-bezier(.4,0,.4,1) infinite}
.pr-rev .rimlight      {animation:rhRev     calc(var(--ocyc)*.22) ease-in-out infinite}
.pr-channel .rimlight,
.pr-page-cast .rimlight{animation:rhChannel var(--ocyc) ease-in-out infinite}
.pr-orbit-fire .rimlight{animation:rhOrbit  var(--ocyc) linear infinite}
.pr-boost .rimlight    {animation:rhBoost   var(--ocyc) ease-in-out infinite}
.pr-blow .rimlight     {animation:rhBlow    var(--ocyc) ease-out infinite}

@keyframes rhCradle {0%,100%{opacity:.22}50%{opacity:.62}}
@keyframes rhSwing  {0%,40%{opacity:.14}56%{opacity:.9}72%{opacity:.3}100%{opacity:.14}}
@keyframes rhDrawSlash{0%,52%{opacity:.1}60%{opacity:1}70%{opacity:.2}100%{opacity:.1}}
@keyframes rhThrust {0%,46%{opacity:.16}57%{opacity:.88}70%{opacity:.24}100%{opacity:.16}}
@keyframes rhSlam   {0%,40%{opacity:.12}53%{opacity:.95}60%{opacity:.55}74%{opacity:.18}100%{opacity:.12}}
@keyframes rhLash   {0%,42%{opacity:.14}53%{opacity:.85}62%{opacity:.3}100%{opacity:.14}}
@keyframes rhFlurry {0%,100%{opacity:.2}50%{opacity:.7}}
@keyframes rhFire   {0%,48%{opacity:.14}53%{opacity:.95}59%{opacity:.3}64%{opacity:.85}
 74%{opacity:.2}100%{opacity:.14}}
@keyframes rhReload {0%,32%{opacity:.14}
 37%{opacity:.95}43%{opacity:.28}49%{opacity:.95}55%{opacity:.2}
 66%{opacity:.5}72%{opacity:.24}78%{opacity:.5}
 90%{opacity:.14}100%{opacity:.14}}
@keyframes rhSpray  {0%,42%{opacity:.18}58%{opacity:.72}74%{opacity:.26}100%{opacity:.18}}
@keyframes rhDraw   {0%,36%{opacity:.12}56%{opacity:.34}62%{opacity:.95}76%{opacity:.18}100%{opacity:.12}}
@keyframes rhPop    {0%,50%{opacity:.14}57%{opacity:1}70%{opacity:.2}100%{opacity:.14}}
@keyframes rhThrow  {0%,36%{opacity:.16}58%{opacity:.8}86%{opacity:.3}100%{opacity:.16}}
@keyframes rhYo     {0%,100%{opacity:.2}50%{opacity:.75}}
@keyframes rhRev    {0%,100%{opacity:.3}50%{opacity:.6}}
@keyframes rhChannel{0%,100%{opacity:.2}50%{opacity:.8}}
@keyframes rhOrbit  {0%{opacity:.2}25%{opacity:.7}50%{opacity:.28}75%{opacity:.7}100%{opacity:.2}}
@keyframes rhBoost  {0%,100%{opacity:.18}40%{opacity:.9}70%{opacity:.34}}
@keyframes rhBlow   {0%,46%{opacity:.16}62%{opacity:.8}76%{opacity:.2}100%{opacity:.16}}

/* elemental motes — tiny, drifting along the edges only */
.edgemotes{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:10px}
.edgemotes i{position:absolute;width:3px;height:3px;border-radius:50%;
 background:var(--o1);box-shadow:0 0 6px var(--o1);opacity:0}
@keyframes emRise{0%{opacity:0;transform:translateY(0)}18%{opacity:.85}
 100%{opacity:0;transform:translateY(-210px)}}
@keyframes emFall{0%{opacity:.8;transform:translateY(0)}100%{opacity:0;transform:translateY(240px)}}
@keyframes emTwinkle{0%,100%{opacity:.1}50%{opacity:.9}}
@keyframes emFlash{0%,58%{opacity:0}62%{opacity:.9}68%{opacity:0}100%{opacity:0}}
/* ---- holographic lettering (contrast hue so it always reads) ---- */
.dname,.dstats,.dstars,.dmove{--txtholo:linear-gradient(112deg,var(--t1),var(--t2) 30%,
 #ffffff 48%,var(--t3) 66%,var(--t1));}
.holotext{background:var(--txtholo);background-size:220% 220%;
 background-position:calc(50% + var(--tx,0)*40%) calc(50% + var(--ty,0)*40%);
 -webkit-background-clip:text;background-clip:text;color:transparent;
 -webkit-text-stroke:.5px rgba(4,6,14,.85);
 filter:drop-shadow(0 1px 0 rgba(0,0,0,.95)) drop-shadow(0 0 5px rgba(0,0,0,.75))
        drop-shadow(0 0 9px var(--t1));
 position:relative;z-index:3}
.dname{position:absolute;left:5.5%;right:5.5%;top:2.4%;height:5.6%;border-radius:9px;
 background:#0d1122;display:flex;align-items:center;justify-content:center;
 font:800 clamp(.8rem,4.2vw,1.28rem)/1 system-ui,sans-serif;
 text-transform:uppercase;letter-spacing:.06em;border:2px solid #2c3660}
.dstats{position:absolute;left:5.5%;right:5.5%;top:73%;height:7%;border-radius:9px;
 background:#0c1020;display:flex;align-items:center;justify-content:space-around;
 font:800 clamp(.68rem,3.4vw,1rem)/1 system-ui,sans-serif;
 border:2px solid #283260}
.dstars{position:absolute;left:5.5%;top:81.4%;height:5.4%;padding:0 12px;border-radius:9px;
 background:#0c1020;display:flex;align-items:center;
 font:800 clamp(.72rem,3.5vw,1.05rem)/1 system-ui,sans-serif;
 letter-spacing:.13em;border:2px solid #283260}
.dmove{position:absolute;left:5.5%;right:5.5%;top:88%;height:8.6%;border-radius:9px;
 background:#0b0f1e;padding:6px 11px;border:2px solid #283260;
 display:flex;flex-direction:column;justify-content:center;gap:3px}
.dmove b{font:800 clamp(.66rem,3.2vw,.96rem)/1 system-ui,sans-serif}
.dmove span{font:600 clamp(.6rem,2.9vw,.86rem)/1 system-ui,sans-serif}


:root{--void:#070a14;--panel:#141b33;--edge:#26305a;--cyan:#00fff2;--mag:#ff43e0;
 --gold:#ffd83d;--violet:#7850ff;--mint:#3dff9e;--ink:#eaeeff;--dim:#8b95bd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--void);color:var(--ink);
 font-family:'Outfit',system-ui,sans-serif;min-height:100vh;
 background-image:radial-gradient(900px 500px at 20% -8%,rgba(120,80,255,.26),transparent 60%),
  radial-gradient(700px 400px at 90% 4%,rgba(0,255,242,.13),transparent 60%)}
h1,h2,h3,.disp{font-family:'Chakra Petch',system-ui;text-transform:uppercase;
 letter-spacing:.05em;margin:0}
header{padding:15px 16px 11px;border-bottom:1px solid var(--edge);
 display:flex;align-items:center;justify-content:space-between;gap:10px;
 position:sticky;top:0;z-index:5;background:rgba(10,13,26,.94);backdrop-filter:blur(9px)}
header h1{font-size:1.06rem}
header h1 b{background:linear-gradient(92deg,var(--cyan),var(--mag) 55%,var(--gold));
 -webkit-background-clip:text;background-clip:text;color:transparent}
main{padding:15px 14px 40px}
input.search{width:100%;background:var(--panel);border:1px solid var(--edge);color:var(--ink);
 border-radius:13px;padding:12px 15px;font-size:.95rem;margin-bottom:12px;outline:none}
input.search:focus{border-color:var(--cyan)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;background:var(--panel);border:1px solid var(--edge);
 color:var(--dim);border-radius:99px;padding:8px 13px;
 font:700 .72rem 'Chakra Petch',system-ui;text-transform:uppercase;letter-spacing:.05em}
.tabs button.on{background:var(--cyan);color:#06070d;border-color:var(--cyan)}
.tabs.stars button.on{background:var(--gold);color:#06070d;border-color:var(--gold)}
.noart5{aspect-ratio:5/7;display:flex;align-items:center;justify-content:center;
 font-size:2rem;background:linear-gradient(160deg,#10162c,#1b1140)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:11px}
.slot{background:var(--panel);border:1px solid var(--edge);border-radius:14px;
 overflow:hidden;transition:.15s;position:relative}
.slot:active{transform:scale(.96)}
.slot img{width:100%;aspect-ratio:5/7;object-fit:cover;display:block}
.slot .cap{padding:7px 8px;font-size:.73rem;font-weight:700;text-transform:capitalize;
 display:flex;justify-content:space-between;align-items:center}
.slot .cap b{color:var(--gold);font-size:.64rem}
.slot[data-r="5"]{border-color:#7a6412;box-shadow:0 0 16px rgba(255,216,61,.24)}
.slot[data-r="4"]{border-color:#5c3a72}
.tag{position:absolute;top:6px;left:6px;background:rgba(6,8,16,.86);
 border:1px solid var(--edge);border-radius:999px;padding:2px 8px;
 font-size:.6rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
#editor{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;
 background:rgba(4,6,13,.97);overflow-y:auto;padding:18px}
#editor.on{display:flex}
.edtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cardwrap{display:flex;justify-content:center;margin-bottom:16px}
.pane{background:var(--panel);border:1px solid var(--edge);border-radius:16px;
 padding:15px;margin-bottom:12px}
.pane h3{font-size:.9rem;color:var(--cyan);margin-bottom:9px}
.pane p{margin:0 0 11px;color:var(--dim);font-size:.85rem;line-height:1.55}
textarea{width:100%;min-height:96px;background:#0b0f1e;border:1px solid var(--edge);
 color:var(--ink);border-radius:12px;padding:12px;font:400 .93rem/1.5 'Outfit',system-ui;
 resize:vertical;outline:none}
textarea:focus{border-color:var(--cyan)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 0}
.chips button{background:#0d1224;border:1px solid var(--edge);color:var(--dim);
 border-radius:999px;padding:8px 13px;font:700 .74rem 'Chakra Petch';
 text-transform:uppercase;letter-spacing:.04em}
.chips button:active{border-color:var(--cyan);color:var(--ink)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;
 font:800 .94rem 'Chakra Petch';text-transform:uppercase;letter-spacing:.06em;
 color:#06070d;background:linear-gradient(96deg,var(--cyan),var(--mint) 48%,var(--gold));
 box-shadow:0 8px 24px rgba(0,255,242,.22)}
.btn.alt{background:linear-gradient(96deg,var(--violet),var(--mag));color:#fff;
 box-shadow:0 8px 24px rgba(255,67,224,.24)}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--edge);box-shadow:none}
.btn+.btn{margin-top:9px}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;justify-content:center}
.meta span{background:#0d1224;border:1px solid var(--edge);border-radius:999px;
 padding:6px 12px;font-size:.74rem;font-weight:700}
.cmdbox{background:#080b16;border:1px solid var(--edge);border-radius:12px;
 padding:12px;font:600 .8rem/1.6 ui-monospace,monospace;color:var(--mint);
 word-break:break-all;margin-top:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:40;
 background:var(--panel);border:1px solid var(--cyan);border-radius:13px;padding:12px 18px;
 font-weight:700;font-size:.86rem;opacity:0;pointer-events:none;transition:.3s;
 max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-8px)}
.empty{text-align:center;padding:50px 20px;color:var(--dim)}
.empty b{display:block;font:800 1.05rem/1.5 'Chakra Petch';color:var(--ink);margin-bottom:6px}
</style>
</head><body>

<header>
  <h1>🎨 CARD <b>STUDIO</b></h1>
  <a href="game.html" style="color:var(--dim);font-size:.8rem;text-decoration:none">Game →</a>
</header>

<main>
  <input class="search" id="q" placeholder="Search all cards…">
  <div class="tabs" id="tabs">
    <button class="on" data-f="all">All</button>
    <button data-f="ducks">🦆 Ducks</button>
    <button data-f="items">🧪 Items</button>
  </div>
  <div class="tabs stars" id="stars">
    <button class="on" data-s="any">Any ★</button>
    <button data-s="5">★★★★★</button><button data-s="4">★★★★</button>
    <button data-s="3">★★★</button><button data-s="2">★★</button><button data-s="1">★</button>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div id="editor">
  <div class="edtop">
    <h2 style="font-size:1.05rem" id="edName">Duck</h2>
    <button class="btn ghost" style="width:auto;padding:9px 15px" id="edClose">Close</button>
  </div>
  <div class="meta" id="edMeta"></div>
  <div class="cardwrap" id="edCard"></div>

  <div class="pane">
    <h3>Change this card</h3>
    <p>Describe what you want different. The duck's name, element and weapon stay the
       same — only the artwork changes.</p>
    <textarea id="note" placeholder="e.g. make the armour gold, show it mid-roar, darker stormy background…"></textarea>
    <div class="chips" id="quick">
      <button>brighter colours</button><button>darker mood</button>
      <button>close-up on the face</button><button>full body wide shot</button>
      <button>gold armour</button><button>more battle damage</button>
      <button>glowing eyes</button><button>rain and mist</button>
      <button>more detailed weapon</button><button>epic sunset lighting</button>
    </div>
  </div>

  <div class="pane">
    <h3>Apply it</h3>
    <p id="liveNote">Changes apply straight away. Don't like it? Retry for a
       different take, or revert to the original.</p>
    <button class="btn" id="applyBtn">✨ Apply change</button>
    <button class="btn alt" id="retryBtn">🎲 Retry — another take</button>
    <button class="btn ghost" id="revertBtn">↩️ Revert to original</button>
    <div id="saveRow" style="display:none">
      <button class="btn ghost" id="saveList" style="margin-top:9px">💾 Save list — make permanent</button>
      <button class="btn ghost" id="clearOvr" style="margin-top:9px">🧹 Clear all browser changes</button>
    </div>
    <div class="cmdbox" id="cmd" style="display:none">…</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var DRAGGING = false;      // finger wins: gyro ignored while dragging
  var cards = [];

  function reg(wrap, card){
    var o = {wrap:wrap, card:card, tx:0, ty:0, gx:0, gy:0};
    cards.push(o);
    return o;
  }

  // one shared animation loop = buttery smooth on every card
  function loop(){
    for (var i=0;i<cards.length;i++){
      var o = cards[i];
      // ease toward target (higher = snappier, lower = smoother)
      o.tx += (o.gx - o.tx) * 0.16;
      o.ty += (o.gy - o.ty) * 0.16;
      if (Math.abs(o.gx-o.tx) < 0.0006) o.tx = o.gx;
      if (Math.abs(o.gy-o.ty) < 0.0006) o.ty = o.gy;
      o.card.style.setProperty('--tx', o.tx.toFixed(4));
      o.card.style.setProperty('--ty', o.ty.toFixed(4));
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  window.bindTilt = function(wrap){
    if (wrap.dataset.tilt) return;
    wrap.dataset.tilt = "1";
    var card = wrap.querySelector('.dscene') || wrap.querySelector('.dcard');
    if (!card) return;
    var o = reg(wrap, card);
    var down = false;

    function target(x, y){
      o.gx = Math.max(-1, Math.min(1, x));
      o.gy = Math.max(-1, Math.min(1, y));
    }
    function fromEvent(e){
      var r = wrap.getBoundingClientRect();
      target(((e.clientX-r.left)/r.width-0.5)*2, ((e.clientY-r.top)/r.height-0.5)*2);
    }
    wrap.addEventListener('pointerdown', function(e){
      down = true; DRAGGING = true;
      try { wrap.setPointerCapture(e.pointerId); } catch(_){}
      fromEvent(e);
      e.preventDefault();
    }, {passive:false});
    wrap.addEventListener('pointermove', function(e){
      if (down) { fromEvent(e); e.preventDefault(); }
      else if (e.pointerType === 'mouse') fromEvent(e);
    }, {passive:false});
    function release(){
      if (!down) return;
      down = false; DRAGGING = false;
      target(0, 0);            // glide back to rest
    }
    wrap.addEventListener('pointerup', release);
    wrap.addEventListener('pointercancel', release);
    wrap.addEventListener('pointerleave', function(e){
      if (!down && e.pointerType === 'mouse') target(0,0);
    });
    o.setGyro = function(x, y){ if (!DRAGGING && !down) target(x, y); };
  };

  window.enableGyro = function(){
    function handle(ev){
      if (DRAGGING) return;                     // finger always wins
      var g = (ev.gamma||0)/30, b = ((ev.beta||0)-42)/30;
      for (var i=0;i<cards.length;i++){
        if (cards[i].setGyro) cards[i].setGyro(g, b);
      }
    }
    function start(){ window.addEventListener('deviceorientation', handle); }
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission){
      DeviceOrientationEvent.requestPermission().then(function(s){ if (s==='granted') start(); });
    } else { start(); }
    return true;
  };
})();
</script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let DEX=[], CUR=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2000);}

const FOILPAL={"ember": ["#ff5a14", "#ff9628", "#ffd65a", "#ffffdc", "#dc321e", "#ff783c", "#b42814"], "frost": ["#b4f0ff", "#ffffff", "#8cd2ff", "#d2ebff", "#6eb4f0", "#e6faff", "#5aa0dc"], "storm": ["#fff078", "#ffffff", "#78c8ff", "#ffe650", "#508cf0", "#dcf0ff", "#ffd23c"], "verdant": ["#5adc6e", "#b4ff8c", "#f0ffc8", "#3cb478", "#c8f078", "#78ffb4", "#32965a"], "tidal": ["#3cbeff", "#8ce6ff", "#ffffff", "#288cdc", "#6efff0", "#b4f0ff", "#1e6ebe"], "cosmic": ["#3a28a0", "#7850ff", "#c896ff", "#ffffff", "#5ab4ff", "#a06eff", "#283cb4"], "sonic": ["#ff78dc", "#ffbef0", "#ffffff", "#ff5aaa", "#ffd778", "#e68cff", "#c83ca0"], "shadow": ["#2a1f3d", "#5a4478", "#8c6eb4", "#c8b4dc", "#1a1228", "#7050a0", "#3c2a55"], "radiant": ["#fff5c8", "#ffffff", "#ffd878", "#fff0a0", "#ffe9b4", "#fffbe6", "#e6c85a"], "iron": ["#8c96aa", "#c8d2e6", "#ffffff", "#5a6478", "#a0aabe", "#dce6f0", "#464e5f"], "venom": ["#7adc32", "#b4ff5a", "#4a9614", "#dcff96", "#2a6400", "#96e63c", "#5aa028"], "crystal": ["#a0f0ff", "#ffffff", "#d2b4ff", "#8cdcf0", "#f0e6ff", "#b4f5ff", "#78b4d2"], "sand": ["#e6c878", "#f5e6b4", "#c8a050", "#fff0c8", "#a07832", "#dcbe78", "#8c6428"], "void": ["#140a28", "#3c1e5a", "#6e32a0", "#a05adc", "#0a0514", "#502878", "#1e0f3c"], "spirit": ["#b4f0e6", "#e6fffa", "#78d2c8", "#ffffff", "#96e6dc", "#c8fff5", "#5aa096"], "tech": ["#00ffb4", "#64ffda", "#ffffff", "#00c896", "#a0fff0", "#28e6b4", "#00966e"], "blood": ["#c81432", "#ff3c5a", "#78000f", "#ff8296", "#a00028", "#e6285a", "#5a000a"], "dream": ["#c8a0ff", "#ffd2f0", "#a0c8ff", "#ffffff", "#e6c8ff", "#b4e6ff", "#8c6ec8"], "chrono": ["#d2b478", "#fff0c8", "#a08c50", "#ffe6a0", "#786432", "#e6d296", "#5a4a1e"], "gravity": ["#5a5aa0", "#8c8cd2", "#c8c8f0", "#3c3c78", "#a0a0e6", "#e6e6ff", "#282850"], "plasma": ["#ff00c8", "#ff64e6", "#ffffff", "#c800a0", "#ff96f0", "#ffc8fa", "#960078"], "bone": ["#e6dcc8", "#fff5e6", "#b4a48c", "#ffffff", "#c8b8a0", "#f0e6d2", "#8c7c64"], "mirror": ["#c8e6f0", "#ffffff", "#a0c8dc", "#e6f5ff", "#8cb4c8", "#dcf0fa", "#6e96aa"], "ash": ["#787878", "#a0a0a0", "#3c3c3c", "#c8c8c8", "#5a5a5a", "#8c8c8c", "#282828"], "magma": ["#ff3c00", "#ff8c28", "#960a00", "#ffc850", "#c81e00", "#ff6414", "#640500"], "aurora": ["#5affc8", "#96ffe6", "#c8a0ff", "#ffffff", "#5ac8ff", "#a0ffdc", "#28a0c8"], "thorn": ["#8c3232", "#c85a5a", "#5a1414", "#e68c8c", "#a04646", "#dc7878", "#3c0a0a"], "gale": ["#c8f0ff", "#ffffff", "#96d2f0", "#e6faff", "#78b4dc", "#dcf5ff", "#5a96be"], "quantum": ["#00c8ff", "#a0f0ff", "#ffffff", "#0096c8", "#64e6ff", "#c8f5ff", "#00648c"], "lunar": ["#dcdcf0", "#ffffff", "#a0a0c8", "#f0f0ff", "#8c8cb4", "#c8c8e6", "#6e6e96"], "solar": ["#ffc800", "#ffe664", "#ff9600", "#fff5b4", "#e6a000", "#ffd228", "#b47800"], "abyss": ["#001e3c", "#00508c", "#0a3c64", "#3c96c8", "#001428", "#0a6ea0", "#000a1e"], "rune": ["#8c5aff", "#b48cff", "#5a28c8", "#dcc8ff", "#6e3cdc", "#a078f0", "#3c1496"], "glass": ["#c8f0f0", "#ffffff", "#a0dcdc", "#e6ffff", "#8cc8c8", "#dcf5f5", "#6ea0a0"], "swarm": ["#c8a000", "#e6c832", "#8c6e00", "#ffe678", "#a08200", "#dcb414", "#5a4600"], "frostfire": ["#ff6432", "#64c8ff", "#ffffff", "#ff9664", "#3296dc", "#ffc8a0", "#c83c14"], "prism": ["#ff5a5a", "#ffd25a", "#5aff8c", "#5ad2ff", "#c85aff", "#ffffff", "#ff5ac8"], "obsidian": ["#1e1e28", "#464655", "#787887", "#a0a0b4", "#0a0a14", "#5a5a6e", "#2d2d3c"], "nectar": ["#ffb4d2", "#ffdcea", "#ff78aa", "#fff0f5", "#e68cb4", "#ffc8dc", "#c85a8c"], "static": ["#c8ff00", "#e6ff64", "#96c800", "#f0ffb4", "#a0dc00", "#dcff32", "#648c00"], "calm": ["#00fff2", "#63f7ff", "#ffffff", "#ff43e0", "#ffd83d", "#3dff9e", "#00c3ff"]};
const PATSIZE={diamond:22,honeycomb:26,shatter:18,starburst:140,prism:14,linear:24};
const PATS=["diamond","diamond","diamond","diamond","diamond","honeycomb","honeycomb",
            "shatter","shatter","starburst","prism","linear"];
function hashName(n){let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return h;}
function foilFor(d){
  const pal=d.palette||FOILPAL.calm;
  const pat=PATS[hashName(d.name)%PATS.length];
  const stops=pal.map((c,i)=>`${c} ${12+Math.round(i*(76/(pal.length-1)))}%`).join(",");
  const wash=`linear-gradient(115deg,transparent 4%,${stops},transparent 96%)`;
  const a=pal[0],b=pal[2],w=pal[3];
  let p;
  if(pat==="diamond")p=`repeating-linear-gradient(45deg,${a} 0 1px,transparent 1px 11px),repeating-linear-gradient(-45deg,${b} 0 1px,transparent 1px 11px)`;
  else if(pat==="honeycomb")p=`repeating-linear-gradient(60deg,${a} 0 1px,transparent 1px 13px),repeating-linear-gradient(-60deg,${b} 0 1px,transparent 1px 13px),repeating-linear-gradient(0deg,${w} 0 1px,transparent 1px 13px)`;
  else if(pat==="shatter")p=`repeating-linear-gradient(28deg,${a} 0 1px,transparent 1px 9px),repeating-linear-gradient(-67deg,${b} 0 1px,transparent 1px 15px)`;
  else if(pat==="starburst")p=`repeating-conic-gradient(${a} 0deg 3deg,transparent 3deg 9deg)`;
  else if(pat==="prism")p=`repeating-linear-gradient(72deg,${a} 0 1px,transparent 1px 5px)`;
  else p=`repeating-linear-gradient(115deg,${a} 0 2px,transparent 2px 12px)`;
  return {wash,patt:p,size:PATSIZE[pat]};
}
function contrastPal(pal){
  function h2r(x){x=x.replace('#','');return [parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)];}
  function r2h(a,b,c){return '#'+[a,b,c].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
  function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
    let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;}
    h/=6;if(h<0)h+=1;return [h,mx?d/mx:0,mx];}
  function hsv2rgb(h,s,v){h=((h%1)+1)%1;const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
    let r,g,b;switch(i%6){case 0:r=v;g=t;b=p;break;case 1:r=q;g=v;b=p;break;case 2:r=p;g=v;b=t;break;
    case 3:r=p;g=q;b=v;break;case 4:r=t;g=p;b=v;break;default:r=v;g=p;b=q;}
    return r2h(r*255,g*255,b*255);}
  const hs=pal.map(c=>rgb2hsv(...h2r(c)));
  const avgS=hs.reduce((a,x)=>a+x[1],0)/hs.length, avgH=hs.reduce((a,x)=>a+x[0],0)/hs.length;
  const weak=avgS<0.34, anchor=weak?(avgH>0.5?0.09:0.55):(avgH+0.5)%1;
  return hs.map((x,i)=>hsv2rgb(anchor+(i-hs.length/2)*0.035, weak?0.95:Math.min(1,Math.max(0.72,x[1]*1.35)), Math.min(1,Math.max(0.88,x[2]*1.1))));
}
function buildCard(d){
  const r=d.rarity, foil=(0.40+r*0.13).toFixed(2), fw=6+r, neon=3+r*3;
  const shim=(7.2-r*0.75).toFixed(2), F=foilFor(d), pal=d.palette||FOILPAL.calm;
  const stars="\u2605".repeat(r)+"\u2606".repeat(5-r);
  const o1=pal[1],o2=pal[0],o3=pal[2],pz=62+r*12;
  const CT=contrastPal(pal), t1=CT[1], t2=CT[3]||CT[0], t3=CT[0];
  const mount=d.mount==='held'?'held':'';
  let m1="",m2="";
  for(let k=0;k<4;k++){const a=k*90*Math.PI/180;
    m1+=`<i class="mote" style="left:${(50+47*Math.cos(a)).toFixed(1)}%;top:${(50+47*Math.sin(a)).toFixed(1)}%"></i>`;}
  for(let k=0;k<3;k++){const a=(k*120+40)*Math.PI/180;
    m2+=`<i class="mote" style="left:${(50+47*Math.cos(a)).toFixed(1)}%;top:${(50+47*Math.sin(a)).toFixed(1)}%"></i>`;}
  const L='<i class="lattice"></i>';
  const pr='pr-'+(d.prop||'cradle');
  const edge=(0.55+r*0.09).toFixed(2);
  const kind=d.pkind||'twinkle';
  const anim={rise:'emRise',fall:'emFall',flash:'emFlash'}[kind]||'emTwinkle';
  let motes='';
  for(let k=0;k<4+r;k++){
    const left=(k*83)%92+4, dly=((k*0.53)%3.1).toFixed(2), dur=(2.9+(k%4)*0.6).toFixed(2);
    const pos = kind==='rise' ? 'bottom:-3%' : kind==='fall' ? 'top:-3%' : `top:${(k*37)%80+6}%`;
    motes+=`<i style="left:${left}%;${pos};animation:${anim} ${dur}s linear ${dly}s infinite"></i>`;
  }
  const EDGE = `<div class="edgemotes">${motes}</div><div class="rimlight"></div>`+
    `<div class="ringmask slow"><i class="tracer"></i></div>`+
    `<div class="ringmask"><i class="tracer"></i></div>`;

  const w=document.createElement('div');
  w.className='dwrap'; w.style.width='min(84vw,340px)';
  w.innerHTML=
   `<div class="dscene ${pr}" style="--foil:${foil};--fw:${fw}px;--neon:${neon}px;--shim:${shim}s;--gcol:${d.glow};--wash:${F.wash};--pat:${F.patt};--patsize:${F.size}px;--o1:${o1};--o2:${o2};--o3:${o3};--ocyc:${d.cycle||4.2}s;--edge:${edge};--t1:${t1};--t2:${t2};--t3:${t3}">`+
    `<div class="dcard">`+
     `<div class="dart"><img src="${heroSrc(d)}" alt="${d.name}">${EDGE}</div>`+
     `<div class="dname foilzone">${L}<span class="holotext">${d.name}</span></div>`+
     `<div class="dstats foilzone">${L}<span class="holotext">ATK ${d.atk}</span><span class="holotext">DEF ${d.def}</span><span class="holotext">SPD ${d.spd}</span></div>`+
     `<div class="dstars foilzone">${L}<span class="holotext">${stars}</span></div>`+
     `<div class="dmove foilzone">${L}<b class="holotext">${d.icon} ${d.badge}</b><span class="holotext">${d.move}</span></div>`+
     `<div class="dframe"></div>`+
    `</div>`+
   `</div>`;
  setTimeout(()=>bindTilt(w),0);
  return w;
}

function imgFor(d){
  const o=OVR[d.name];
  if(o) return (typeof o==='string')?o:o.url;
  return d.kind==='item' ? 'cards/items/'+d.art : 'cards/ducks/'+d.hero;
}
let FILT='all', STARS='any';
async function load(){
  const grab=async u=>{ try{ const r=await fetch(u+'?t='+Date.now()); return await r.json(); }catch(e){ return null; } };
  const [m,it]=await Promise.all([grab('cards/ducks/manifest.json'),grab('cards/items/items.json')]);
  DEX=[];
  (m&&m.ducks||[]).forEach(d=>DEX.push(Object.assign({},d,{kind:'duck'})));
  (it&&it.items||[]).forEach(i=>DEX.push(Object.assign({},i,{kind:'item',
    badge:i.familyLabel,move:i.text,hero:i.art})));
  render();
}
function render(){
  const q=($('#q').value||'').toLowerCase(), g=$('#grid'); g.innerHTML='';
  let n=0;
  for(const d of DEX){
    if(q && !d.name.toLowerCase().includes(q)) continue;
    if(STARS!=='any' && String(d.rarity)!==STARS) continue;
    if(FILT==='ducks' && d.kind!=='duck') continue;
    if(FILT==='items' && d.kind!=='item') continue;
    const el=document.createElement('div');
    el.className='slot'; el.dataset.r=d.rarity;
    el.innerHTML=`<img loading="lazy" src="${heroSrc(d)}" alt="${d.name}">`+
      `<span class="tag">${d.elementLabel||''}</span>`+
      `<div class="cap"><span>${d.name}</span><b>${'\u2605'.repeat(d.rarity)}</b></div>`;
    el.onclick=()=>openEditor(d);
    g.appendChild(el); n++;
  }
  if(!n) g.innerHTML='<div class="empty"><b>No cards yet</b>Run <code>runduck</code> to paint your roster.</div>';
}
function openEditor(d){
  CUR=d;
  $('#edName').textContent=d.name;
  $('#edMeta').innerHTML=
    `<span>${d.elementLabel||''}</span><span>${d.icon} ${d.badge}</span>`+
    `<span>${'\u2605'.repeat(d.rarity)}</span><span>${d.move}</span>`+
    (d.abilityName?`<span>${d.abilityName}</span>`:'');
  const c=$('#edCard'); c.innerHTML=''; c.appendChild(buildCard(d));
  $('#note').value='';
  updateCmd();
  $('#editor').classList.add('on');
  document.body.style.overflow='hidden';
}
let LIVE=false;                 // local server present? (optional, for saving to disk)
const OVR_KEY='duck_overrides_v1';
let OVR={};
try{ OVR=JSON.parse(localStorage.getItem(OVR_KEY))||{}; }catch(e){ OVR={}; }
function saveOvr(){ try{ localStorage.setItem(OVR_KEY,JSON.stringify(OVR)); }catch(e){} }

// browser talks straight to the image AI — works with no Termux at all
const POLLI='https://image.pollinations.ai/prompt/';
function artUrl(d,note,seed){
  const p = note ? `${d.prompt}, ${note}` : d.prompt;
  return POLLI+encodeURIComponent(p)+
    `?width=832&height=832&seed=${seed}&nologo=true&model=flux&enhance=true`;
}
function heroSrc(d){
  const o=OVR[d.name];
  return o ? o.url : `cards/ducks/${d.hero}`;
}

fetch('/api/ping').then(r=>r.json()).then(j=>{LIVE=!!j.live;paintMode();}).catch(()=>paintMode());
function paintMode(){
  const n=$('#liveNote');
  n.innerHTML = LIVE
    ? "Changes apply straight away and are saved to your project."
    : "Changes apply straight away right here in your browser. "+
      "To make them permanent, tap <b>Save list</b> and run it in Termux later.";
  $('#saveRow').style.display = LIVE ? 'none' : 'block';
}
function updateCmd(){
  if(!CUR) return;
  const note=($('#note').value||'').trim().replace(/"/g,"'");
  $('#cmd').textContent = note ? `restyle ${CUR.name} "${note}"`
                               : `restyle ${CUR.name} "your change here"`;
}
$('#note').oninput=updateCmd;

function busy(on,msg){
  ['applyBtn','retryBtn','revertBtn'].forEach(id=>{
    const b=$('#'+id); if(b){ b.disabled=on; b.style.opacity=on?.45:1; }
  });
  if(on) toast(msg||'Working…');
}
function refreshCard(){
  const c=$('#edCard'); c.innerHTML=''; c.appendChild(buildCard(CUR));
}

// generate in the browser, show it the moment it lands
function generate(note,seed,msg){
  if(!CUR) return;
  busy(true,msg);
  const url=artUrl(CUR,note,seed);
  const img=new Image();
  img.onload=()=>{
    OVR[CUR.name]={url:url,note:note,seed:seed,at:Date.now()};
    saveOvr(); refreshCard(); busy(false); toast('Done — tap Retry for another take');
    if(LIVE){ // if the server happens to be up, save it to disk too
      fetch('/api/restyle',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:CUR.name,note:note,seed:seed})}).catch(()=>{});
    }
  };
  img.onerror=()=>{ busy(false); toast('Image service did not answer — try again'); };
  img.src=url;
}
$('#applyBtn').onclick=()=>{
  const note=($('#note').value||'').trim();
  if(!note){ toast('Describe a change first'); return; }
  generate(note, Math.floor(Math.random()*900000)+1, 'Repainting…');
};
$('#retryBtn').onclick=()=>{
  const note=($('#note').value||'').trim();
  generate(note, Math.floor(Math.random()*900000)+1, 'Another take…');
};
$('#revertBtn').onclick=()=>{
  if(!CUR) return;
  delete OVR[CUR.name]; saveOvr(); refreshCard(); toast('Back to the original');
  if(LIVE) fetch('/api/revert',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:CUR.name})}).catch(()=>{});
};
$('#saveList').onclick=()=>{
  const lines=Object.entries(OVR).map(([n,o])=>`restyle ${n} "${(o.note||'').replace(/"/g,"'")}" ${o.seed}`);
  if(!lines.length){ toast('No changes to save yet'); return; }
  const txt=lines.join(String.fromCharCode(10));
  navigator.clipboard?.writeText(txt).then(
    ()=>toast(`${lines.length} change${lines.length>1?'s':''} copied — paste in Termux`),
    ()=>{ $('#cmd').style.display='block'; $('#cmd').textContent=txt; toast('Shown below — long-press to copy'); });
};
$('#clearOvr').onclick=()=>{
  if(!Object.keys(OVR).length){ toast('Nothing to clear'); return; }
  OVR={}; saveOvr(); refreshCard(); render(); toast('All browser changes cleared');
};
$('#edClose').onclick=()=>{$('#editor').classList.remove('on');document.body.style.overflow='';};
$('#q').oninput=render;
load();
</script>
