<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>Manager · Getting Ducked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:#070a14;color:#eaeeff;
 font-family:'Outfit',system-ui,sans-serif;padding-bottom:90px;
 background-image:
  radial-gradient(900px 520px at 18% -8%,rgba(0,255,242,.18),transparent 60%),
  radial-gradient(760px 430px at 88% 6%,rgba(120,80,255,.14),transparent 60%)}
a{color:inherit}
.topbar{position:sticky;top:0;z-index:10;background:rgba(7,10,20,.92);backdrop-filter:blur(10px);
 border-bottom:1px solid #26305a;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:'Chakra Petch',system-ui;font-weight:800;text-transform:uppercase;
 letter-spacing:.04em;font-size:1rem;display:flex;align-items:center;gap:8px}
.brand .tag{font-size:.62rem;background:rgba(0,255,242,.16);color:#7af5ee;
 border:1px solid #1a6a75;padding:2px 8px;border-radius:7px;letter-spacing:.08em}
.leave{color:#8b95bd;font-size:.8rem;text-decoration:none}
.wrap{max-width:820px;margin:0 auto;padding:16px}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 16px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font:700 .78rem 'Chakra Petch',system-ui;text-transform:uppercase;
 letter-spacing:.04em;color:#8b95bd;background:#0c1020;border:1px solid #26305a;
 border-radius:12px;padding:9px 14px;white-space:nowrap}
.tab.active{color:#06070d;background:linear-gradient(96deg,#00fff2,#3dff9e 60%,#ffd83d);border-color:transparent}

.panel{display:none;padding:18px 0}
.panel.on{display:block}
.card{background:rgba(20,27,51,.82);border:1px solid #26305a;border-radius:18px;
 padding:18px;margin-bottom:14px}
.card h2{font-family:'Chakra Petch',system-ui;font-size:.92rem;text-transform:uppercase;
 letter-spacing:.05em;margin:0 0 14px;color:#eaeeff}

label{display:block;font:700 .72rem 'Chakra Petch',system-ui;text-transform:uppercase;
 letter-spacing:.08em;color:#8b95bd;margin:0 0 6px}
input,select,textarea{width:100%;background:#0c1020;border:1px solid #26305a;color:#eaeeff;
 border-radius:12px;padding:12px 14px;font-size:.92rem;outline:none;margin-bottom:12px;
 font-family:'Outfit',system-ui}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{border-color:#00fff2}
.btn{border:0;border-radius:12px;padding:12px 18px;font:800 .82rem 'Chakra Petch',system-ui;
 text-transform:uppercase;letter-spacing:.05em;color:#06070d;
 background:linear-gradient(96deg,#00fff2,#3dff9e 48%,#ffd83d);cursor:pointer}
.btn.ghost{background:#141b33;color:#eaeeff;border:1px solid #26305a}
.btn.danger{background:linear-gradient(96deg,#ff5570,#ff8c3d)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:0 0 auto}

.list-item{background:#0c1020;border:1px solid #26305a;border-radius:14px;padding:13px 15px;
 margin-bottom:8px}
.list-item .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.list-item .name{font:700 .88rem 'Outfit',system-ui}
.badge{font:800 .62rem 'Chakra Petch',system-ui;text-transform:uppercase;letter-spacing:.06em;
 padding:3px 8px;border-radius:7px}
.badge.new{background:rgba(255,216,61,.16);color:#ffd83d}
.badge.replied{background:rgba(61,255,158,.14);color:#a8ffd4}
.muted{color:#8b95bd;font-size:.8rem}
.msg{border-radius:12px;padding:11px 13px;font-size:.84rem;margin-bottom:12px;display:none}
.msg.on{display:block}
.msg.err{background:rgba(255,67,100,.14);border:1px solid #7a2740;color:#ffb4c2}
.msg.ok{background:rgba(61,255,158,.12);border:1px solid #1f7a52;color:#a8ffd4}
.empty{text-align:center;color:#5d688f;font-size:.85rem;padding:30px 0}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#8b95bd}
.link-item{background:#0c1020;border:1px solid #26305a;border-radius:14px;padding:14px;margin-bottom:8px}
.link-item a{color:#00fff2;font-weight:700;word-break:break-all}
</style></head><body>

<div id="gate" class="gate">Checking access…</div>

<div id="app" style="display:none">
  <div class="topbar">
    <div class="brand">🦆 <span>Manager</span><span class="tag">TOOLBELT</span></div>
    <a class="leave" href="game.html">Exit to game →</a>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="wrap">
    <div class="panel on" id="p-players">
      <div class="card">
        <h2>Players</h2>
        <input id="playerSearch" placeholder="Search by handle…">
        <div id="playerResults"><div class="empty">Search for a player above</div></div>
      </div>
    </div>

    <div class="panel" id="p-suggestions">
      <div class="card">
        <h2>Player Suggestions</h2>
        <div id="suggList"><div class="empty">Loading…</div></div>
      </div>
    </div>

    <div class="panel" id="p-keylinks">
      <div class="card">
        <h2>Key Links</h2>
        <div id="keyLinksList"><div class="empty">Loading…</div></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const $ = s => document.querySelector(s);
let sb = null, ME = null, PERMS = {};

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function timeAgo(iso){
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if(s < 60) return 'just now';
  if(s < 3600) return Math.floor(s/60) + 'm ago';
  if(s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

(async function(){
  if(typeof SUPABASE_URL === 'undefined' || !SUPABASE_URL || SUPABASE_URL.includes('PASTE')){
    location.href = 'auth.html'; return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data: { user } } = await sb.auth.getUser();
  if(!user){ location.href = 'auth.html'; return; }

  const { data: staffRow } = await sb.from('staff').select('role, permissions').eq('user_id', user.id).maybeSingle();
  if(!staffRow || (staffRow.role !== 'manager' && staffRow.role !== 'admin')){ location.href = 'game.html'; return; }

  ME = user;
  PERMS = staffRow.role === 'admin' ? { key_links: true, hard_ban: true, grant_currency: true } : (staffRow.permissions || {});

  buildTabs();
  $('#gate').style.display = 'none';
  $('#app').style.display = 'block';

  loadSuggestions();
  if(PERMS.key_links) loadKeyLinks();
})();

function buildTabs(){
  const tabs = [{ id: 'players', label: 'Players' }, { id: 'suggestions', label: 'Suggestions' }];
  if(PERMS.key_links) tabs.push({ id: 'keylinks', label: 'Key Links' });
  $('#tabs').innerHTML = tabs.map((t,i) => `<div class="tab ${i===0?'active':''}" data-p="${t.id}">${t.label}</div>`).join('');
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
      t.classList.add('active');
      $('#p-' + t.dataset.p).classList.add('on');
    };
  });
}

/* ---------- players (soft flag always, ban/grant only if permitted) ---------- */
let searchTimer = null;
$('#playerSearch').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => searchPlayers(e.target.value.trim()), 350);
});

async function searchPlayers(q){
  const box = $('#playerResults');
  if(!q){ box.innerHTML = `<div class="empty">Search for a player above</div>`; return; }
  const { data, error } = await sb.from('players').select('*').ilike('handle', `%${q}%`).limit(15);
  if(error){ box.innerHTML = `<div class="empty">Search failed.</div>`; return; }
  if(!data.length){ box.innerHTML = `<div class="empty">No players match "${esc(q)}".</div>`; return; }
  box.innerHTML = data.map(p => `
    <div class="list-item" id="p-row-${p.id}">
      <div class="top">
        <span class="name">${esc(p.handle)}</span>
        <span class="badge">${p.career_tier}</span>
      </div>
      <div class="muted">Lvl ${p.level} · ${p.wins}W-${p.losses}L</div>
      <div class="row" style="margin-top:8px">
        ${PERMS.grant_currency ? `<button class="btn ghost" data-grant-packs="${p.id}">+3 packs</button>` : ''}
        <button class="btn ghost" data-mod-toggle="${p.id}">Moderate ▾</button>
      </div>
      <div id="mod-${p.id}" style="display:none;margin-top:10px"></div>
    </div>
  `).join('');
  box.querySelectorAll('[data-grant-packs]').forEach(b => b.onclick = () => grantPacks(b.dataset.grantPacks));
  box.querySelectorAll('[data-mod-toggle]').forEach(b => b.onclick = () => toggleMod(b.dataset.modToggle));
}

async function grantPacks(playerId){
  const { data: p } = await sb.from('players').select('packs').eq('id', playerId).single();
  await sb.from('players').update({ packs: (p.packs || 0) + 3 }).eq('id', playerId);
  await sb.from('staff_actions').insert({ actor_id: ME.id, actor_email: ME.email, action: 'grant_packs', target: playerId, detail: { amount: 3 } });
  searchPlayers($('#playerSearch').value.trim());
}

function toggleMod(playerId){
  const box = $('#mod-' + playerId);
  const opening = box.style.display === 'none';
  box.style.display = opening ? 'block' : 'none';
  if(opening && !box.dataset.loaded){
    box.dataset.loaded = '1';
    box.innerHTML = `
      <div class="card" style="margin-bottom:8px">
        <label>Issue a warning (player must accept before playing again)</label>
        <textarea id="flagText-${playerId}" placeholder="What are they being warned about?"></textarea>
        <button class="btn ghost" data-send-flag="${playerId}">Send warning</button>
      </div>
      ${PERMS.hard_ban ? `
      <div class="card">
        <label>Issue a ban</label>
        <textarea id="banReason-${playerId}" placeholder="Reason…"></textarea>
        <select id="banDuration-${playerId}">
          <option value="24">24 hours</option>
          <option value="72">3 days</option>
          <option value="168">7 days</option>
        </select>
        <button class="btn danger" data-send-ban="${playerId}">Ban player</button>
      </div>` : `<div class="muted">You don't have permission to issue bans — ask an admin.</div>`}
    `;
    box.querySelector(`[data-send-flag="${playerId}"]`).onclick = () => sendFlag(playerId);
    const banBtn = box.querySelector(`[data-send-ban="${playerId}"]`);
    if(banBtn) banBtn.onclick = () => sendBan(playerId);
  }
}

async function sendFlag(playerId){
  const text = $('#flagText-' + playerId).value.trim();
  if(!text) return;
  const { error } = await sb.rpc('issue_flag', { target_player: playerId, warning_message: text });
  if(error){ alert(error.message); return; }
  $('#flagText-' + playerId).value = '';
  alert("Warning sent — they'll see it next time they log in.");
}

async function sendBan(playerId){
  const reason = $('#banReason-' + playerId).value.trim();
  const dur = parseInt($('#banDuration-' + playerId).value, 10);
  if(!reason){ alert('Enter a reason first.'); return; }
  if(!confirm(`Ban this player for ${dur} hours?`)) return;
  const { error } = await sb.rpc('issue_ban', { target_player: playerId, ban_reason: reason, duration_hours: dur });
  if(error){ alert(error.message); return; }
  $('#banReason-' + playerId).value = '';
  alert('Player banned.');
}

/* ---------- suggestions ---------- */
async function loadSuggestions(){
  const box = $('#suggList');
  const { data, error } = await sb.from('suggestions').select('*, players(handle)').order('created_at', {ascending:false}).limit(50);
  if(error){ box.innerHTML = `<div class="empty">Couldn't load suggestions.</div>`; return; }
  if(!data.length){ box.innerHTML = `<div class="empty">No suggestions yet.</div>`; return; }
  box.innerHTML = data.map(s => `
    <div class="list-item">
      <div class="top">
        <span class="name">${esc(s.players?.handle || 'unknown')}</span>
        <span class="muted">${timeAgo(s.created_at)}</span>
        <span class="badge ${s.status === 'replied' ? 'replied' : 'new'}">${s.status}</span>
      </div>
      <div class="muted" style="margin:6px 0">${esc(s.message)}</div>
      ${s.reply ? `<div class="muted"><b style="color:#a8ffd4">Your reply:</b> ${esc(s.reply)}</div>` : `
        <textarea id="reply-${s.id}" placeholder="Write a reply…" style="margin-top:8px"></textarea>
        <button class="btn ghost" data-reply="${s.id}">Send reply</button>
      `}
    </div>
  `).join('');
  box.querySelectorAll('[data-reply]').forEach(b => b.onclick = () => replySuggestion(b.dataset.reply));
}

async function replySuggestion(id){
  const reply = $('#reply-' + id).value.trim();
  if(!reply) return;
  await sb.from('suggestions').update({
    reply, status: 'replied', replied_by: ME.id, replied_at: new Date().toISOString()
  }).eq('id', id);
  await sb.from('staff_actions').insert({ actor_id: ME.id, actor_email: ME.email, action: 'reply_suggestion', target: String(id) });
  loadSuggestions();
}

/* ---------- key links ---------- */
async function loadKeyLinks(){
  const box = $('#keyLinksList');
  const { data, error } = await sb.from('key_links').select('*').order('sort_order');
  if(error){ box.innerHTML = `<div class="empty">Couldn't load links.</div>`; return; }
  if(!data.length){ box.innerHTML = `<div class="empty">No links added yet.</div>`; return; }
  box.innerHTML = data.map(l => `
    <div class="link-item">
      <b>${esc(l.label)}</b><br>
      <a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a>
      ${l.note ? `<div class="muted" style="margin-top:4px">${esc(l.note)}</div>` : ''}
    </div>
  `).join('');
}
</script>
</body></html>
