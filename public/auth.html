<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>Sign in · Getting Ducked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:#070a14;color:#eaeeff;
 font-family:'Outfit',system-ui,sans-serif;display:flex;flex-direction:column;
 align-items:center;justify-content:center;padding:24px 18px;
 background-image:
  radial-gradient(900px 520px at 18% -8%,rgba(120,80,255,.30),transparent 60%),
  radial-gradient(760px 430px at 88% 6%,rgba(0,255,242,.16),transparent 60%),
  radial-gradient(700px 600px at 50% 108%,rgba(255,67,224,.18),transparent 60%)}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
#sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;
 animation:tw 3.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.14}50%{opacity:.95}}
.card{position:relative;z-index:1;width:100%;max-width:400px;
 background:rgba(20,27,51,.86);border:1px solid #26305a;border-radius:22px;
 padding:26px 22px;backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.duck{font-size:2.9rem;text-align:center;display:block;margin-bottom:6px;
 filter:drop-shadow(0 6px 18px rgba(255,216,61,.4));animation:bob 3.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
h1{font-family:'Chakra Petch',system-ui;font-size:1.42rem;text-align:center;margin:0 0 4px;
 text-transform:uppercase;letter-spacing:.04em}
h1 b{background:linear-gradient(94deg,#00fff2,#ff43e0 52%,#ffd83d);
 -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:#8b95bd;font-size:.85rem;margin-bottom:20px}
label{display:block;font:700 .72rem 'Chakra Petch',system-ui;text-transform:uppercase;
 letter-spacing:.08em;color:#8b95bd;margin:0 0 6px}
input{width:100%;background:#0c1020;border:1px solid #26305a;color:#eaeeff;
 border-radius:13px;padding:14px 15px;font-size:1rem;outline:none;margin-bottom:14px;
 font-family:'Outfit',system-ui}
input:focus{border-color:#00fff2}
input.code{text-align:center;font:800 1.7rem 'Chakra Petch',system-ui;
 letter-spacing:.55em;padding-left:.55em}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;
 font:800 .92rem 'Chakra Petch',system-ui;text-transform:uppercase;letter-spacing:.06em;
 color:#06070d;background:linear-gradient(96deg,#00fff2,#3dff9e 48%,#ffd83d);
 box-shadow:0 8px 24px rgba(0,255,242,.22);margin-bottom:10px}
.btn:active{transform:translateY(2px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{background:#141b33;color:#eaeeff;border:1px solid #26305a;box-shadow:none}
.btn.google{background:#fff;color:#1f1f1f;box-shadow:0 8px 24px rgba(255,255,255,.14);
 display:flex;align-items:center;justify-content:center;gap:10px}
.btn.google svg{width:19px;height:19px}
.or{display:flex;align-items:center;gap:12px;color:#5d688f;font-size:.76rem;
 margin:16px 0;text-transform:uppercase;letter-spacing:.1em}
.or::before,.or::after{content:"";flex:1;height:1px;background:#26305a}
.link{text-align:center;color:#8b95bd;font-size:.84rem;margin-top:14px}
.link a{color:#00fff2;text-decoration:none;font-weight:700}
.msg{border-radius:12px;padding:12px 14px;font-size:.85rem;margin-bottom:14px;display:none;
 line-height:1.5}
.msg.on{display:block}
.msg.err{background:rgba(255,67,100,.14);border:1px solid #7a2740;color:#ffb4c2}
.msg.ok{background:rgba(61,255,158,.12);border:1px solid #1f7a52;color:#a8ffd4}
.msg.info{background:rgba(0,255,242,.10);border:1px solid #1a6a75;color:#a8f0ff}
.step{display:none}.step.on{display:block}
.back{background:none;border:0;color:#8b95bd;font-size:.84rem;padding:8px 0;
 font-family:'Outfit',system-ui}
.setup{position:relative;z-index:1;max-width:400px;margin-top:16px;color:#5d688f;
 font-size:.76rem;text-align:center;line-height:1.6}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(6,7,13,.3);
 border-top-color:#06070d;border-radius:50%;animation:sp .7s linear infinite;
 vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}

#sky::before,#sky::after{content:"";position:absolute;inset:-30%;filter:blur(70px);opacity:.5}
#sky::before{background:radial-gradient(38% 30% at 22% 18%,rgba(120,80,255,.8),transparent 62%);
 animation:drift1 26s ease-in-out infinite}
#sky::after{background:radial-gradient(40% 32% at 68% 86%,rgba(255,67,224,.65),transparent 62%);
 animation:drift2 34s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,-5%) scale(1.12)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-6%,4%) scale(1)}}
.card{position:relative;overflow:hidden;animation:cardIn .5s cubic-bezier(.2,.9,.3,1)}
@keyframes cardIn{0%{opacity:0;transform:translateY(22px) scale(.97)}100%{opacity:1;transform:none}}
.card::before{content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;
 padding:1px;background:linear-gradient(130deg,rgba(0,255,242,.6),transparent 40%,
  transparent 60%,rgba(255,67,224,.55));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
 -webkit-mask-composite:xor;mask-composite:exclude}
h1 b{background-size:220% auto;animation:brandFlow 6s linear infinite}
@keyframes brandFlow{0%{background-position:0% 50%}100%{background-position:220% 50%}}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-45%;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
 animation:sweep 3.6s ease-in-out infinite}
@keyframes sweep{0%{left:-45%}55%{left:120%}100%{left:120%}}
</style></head><body>
<div id="sky"></div>

<div class="card">
  <span class="duck">🦆</span>
  <h1>Getting <b>Ducked</b></h1>
  <div class="sub" id="sub">Sign in to save your collection</div>

  <div class="msg" id="msg"></div>

  <!-- ---------- STEP 1: email ---------- -->
  <div class="step on" id="s-email">
    <label for="email">Email address</label>
    <input id="email" type="email" inputmode="email" autocomplete="email"
           placeholder="you@example.com">
    <button class="btn" id="btnContinue">Continue</button>

    <div class="or">or</div>
    <button class="btn google" id="btnGoogle">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.6 5.9c4.4-4.1 6.7-10.1 6.7-17.3z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.5-2 15.3-5.5l-7.6-5.9c-2.1 1.4-4.8 2.3-7.7 2.3-6.3 0-11.7-3.7-13.6-9.2l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Continue with Google
    </button>
  </div>

  <!-- ---------- STEP 2: 6-digit code ---------- -->
  <div class="step" id="s-code">
    <label for="code">Enter the 6-digit code</label>
    <input id="code" class="code" type="text" inputmode="numeric" maxlength="6"
           autocomplete="one-time-code" placeholder="······">
    <button class="btn" id="btnVerify">Verify</button>
    <button class="btn ghost" id="btnResend">Send it again</button>
    <button class="back" id="btnBack1">← Use a different email</button>
  </div>

  <!-- ---------- STEP 3: create password ---------- -->
  <div class="step" id="s-newpass">
    <label for="np">Create a password</label>
    <input id="np" type="password" autocomplete="new-password" placeholder="At least 8 characters">
    <label for="np2">Confirm password</label>
    <input id="np2" type="password" autocomplete="new-password" placeholder="Type it again">
    <button class="btn" id="btnSetPass">Finish and play</button>
  </div>

  <!-- ---------- STEP 4: returning login ---------- -->
  <div class="step" id="s-pass">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Your password">
    <button class="btn" id="btnLogin">Sign in</button>
    <button class="btn ghost" id="btnForgot">Email me a code instead</button>
    <button class="back" id="btnBack2">← Use a different email</button>
  </div>

  <div class="link" id="foot"></div>
</div>

<div class="setup" id="setupNote"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const $ = s => document.querySelector(s);
let sb = null, EMAIL = "";

function msg(text, kind){
  const m = $('#msg');
  m.className = 'msg on ' + (kind || 'info');
  m.innerHTML = text;
}
function clearMsg(){ $('#msg').className = 'msg'; }
function step(id){
  document.querySelectorAll('.step').forEach(s => s.classList.remove('on'));
  $('#s-' + id).classList.add('on');
  clearMsg();
}
function busy(btn, on, label){
  btn.disabled = on;
  if(on){ btn.dataset.old = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>' + (label||'Working…'); }
  else if(btn.dataset.old){ btn.innerHTML = btn.dataset.old; }
}

/* ---------- boot ---------- */
(function(){
  let h='';
  for(let i=0;i<52;i++)
    h+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${(Math.random()*3.6).toFixed(2)}s"></i>`;
  $('#sky').innerHTML=h;

  if(typeof SUPABASE_URL === 'undefined' || !SUPABASE_URL || SUPABASE_URL.includes('PASTE')){
    $('#setupNote').innerHTML =
      "⚙️ Not connected yet — open <b>supabase-config.js</b> and paste your project URL and key. "+
      "See <b>SETUP-LOGIN.md</b> for the walkthrough.";
    msg("Accounts aren't switched on yet. You can still play — your collection saves on this device.", 'info');
    $('#foot').innerHTML = '<a href="game.html">Play without an account →</a>';
    document.querySelectorAll('.btn').forEach(b => b.disabled = true);
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  $('#foot').innerHTML = '<a href="game.html">Play without an account →</a>';

  // already signed in? go straight through (staff get routed to the chooser)
  sb.auth.getSession().then(({data}) => {
    if(data.session) redirectAfterLogin();
  });
})();

async function redirectAfterLogin(){
  try{
    const { data: { user } } = await sb.auth.getUser();
    if(user){
      const { data: staffRow } = await sb.from('staff').select('role').eq('user_id', user.id).maybeSingle();
      if(staffRow){ location.href = 'staff.html'; return; }
    }
  }catch(e){ /* fall through to game if the check fails */ }
  location.href = 'game.html';
}

/* ---------- step 1: does this email exist? ---------- */
$('#btnContinue').onclick = async () => {
  const email = $('#email').value.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg('That email doesn\'t look right.', 'err'); return; }
  EMAIL = email;
  busy($('#btnContinue'), true, 'Checking…');
  try{
    const { error } = await sb.auth.signInWithOtp({
      email, options: { shouldCreateUser: true }
    });
    if(error) throw error;
    $('#sub').textContent = 'We sent a code to ' + email;
    step('code');
    msg('Check your inbox for a 6-digit code. It expires in 60 minutes.', 'ok');
  }catch(e){
    msg(friendly(e), 'err');
  }
  busy($('#btnContinue'), false);
};

/* ---------- step 2: verify the code ---------- */
$('#btnVerify').onclick = async () => {
  const token = $('#code').value.trim();
  if(token.length !== 6){ msg('Enter all six digits.', 'err'); return; }
  busy($('#btnVerify'), true, 'Verifying…');
  try{
    const { data, error } = await sb.auth.verifyOtp({
      email: EMAIL, token, type: 'email'
    });
    if(error) throw error;
    const hasPass = data.user?.user_metadata?.has_password;
    if(hasPass){ redirectAfterLogin(); return; }
    $('#sub').textContent = 'Almost there — set a password';
    step('newpass');
  }catch(e){
    msg(friendly(e), 'err');
  }
  busy($('#btnVerify'), false);
};

$('#btnResend').onclick = async () => {
  busy($('#btnResend'), true, 'Sending…');
  try{
    const { error } = await sb.auth.signInWithOtp({ email: EMAIL, options:{ shouldCreateUser:true } });
    if(error) throw error;
    msg('New code sent.', 'ok');
  }catch(e){ msg(friendly(e), 'err'); }
  busy($('#btnResend'), false);
};

/* ---------- step 3: set the password ---------- */
$('#btnSetPass').onclick = async () => {
  const a = $('#np').value, b = $('#np2').value;
  if(a.length < 8){ msg('Password needs at least 8 characters.', 'err'); return; }
  if(a !== b){ msg('Those two passwords don\'t match.', 'err'); return; }
  busy($('#btnSetPass'), true, 'Saving…');
  try{
    const { error } = await sb.auth.updateUser({
      password: a, data: { has_password: true }
    });
    if(error) throw error;
    redirectAfterLogin();
  }catch(e){ msg(friendly(e), 'err'); busy($('#btnSetPass'), false); }
};

/* ---------- step 4: returning user ---------- */
$('#btnLogin').onclick = async () => {
  busy($('#btnLogin'), true, 'Signing in…');
  try{
    const { error } = await sb.auth.signInWithPassword({
      email: EMAIL, password: $('#pw').value
    });
    if(error) throw error;
    redirectAfterLogin();
  }catch(e){ msg(friendly(e), 'err'); busy($('#btnLogin'), false); }
};
$('#btnForgot').onclick = async () => {
  busy($('#btnForgot'), true, 'Sending…');
  try{
    const { error } = await sb.auth.signInWithOtp({ email: EMAIL });
    if(error) throw error;
    $('#sub').textContent = 'We sent a code to ' + EMAIL;
    step('code');
    msg('Check your inbox for a 6-digit code.', 'ok');
  }catch(e){ msg(friendly(e), 'err'); }
  busy($('#btnForgot'), false);
};

/* ---------- google ---------- */
$('#btnGoogle').onclick = async () => {
  busy($('#btnGoogle'), true, 'Opening Google…');
  try{
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: location.origin + '/auth.html' }
    });
    if(error) throw error;
  }catch(e){ msg(friendly(e), 'err'); busy($('#btnGoogle'), false); }
};

/* ---------- misc ---------- */
$('#btnBack1').onclick = () => { $('#sub').textContent='Sign in to save your collection'; step('email'); };
$('#btnBack2').onclick = () => { $('#sub').textContent='Sign in to save your collection'; step('email'); };
$('#code').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g,'').slice(0,6);
  if(e.target.value.length === 6) $('#btnVerify').click();
});
$('#email').addEventListener('keydown', e => { if(e.key==='Enter') $('#btnContinue').click(); });
$('#pw').addEventListener('keydown', e => { if(e.key==='Enter') $('#btnLogin').click(); });

function friendly(e){
  const m = (e && e.message || String(e)).toLowerCase();
  if(m.includes('rate limit') || m.includes('too many'))
    return 'Too many tries. Wait a minute and try again.';
  if(m.includes('invalid') && m.includes('token'))
    return 'That code is wrong or has expired. Try "Send it again".';
  if(m.includes('invalid login'))
    return 'Wrong password. Use "Email me a code instead" if you\'ve forgotten it.';
  if(m.includes('provider is not enabled'))
    return 'Google sign-in isn\'t switched on yet in Supabase.';
  if(m.includes('failed to fetch') || m.includes('network'))
    return 'Can\'t reach the server. Check your connection.';
  return e.message || 'Something went wrong. Try again.';
}
</script>
</body></html>
