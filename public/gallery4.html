<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦆 Duck Gallery 4</title>
<style>
  :root { --bg:#0b0e1a; --card:#151a2e; --edge:#2a3352; --gold:#ffd24a; --txt:#e8ebf5; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:linear-gradient(180deg,#0b0e1a 70%,transparent);
           padding:16px 14px 10px; text-align:center; }
  h1 { font-size:1.5rem; letter-spacing:.5px; }
  h1 span { color:var(--gold); }
  #count { color:#9aa3c0; font-size:.85rem; margin-top:4px; }
  .bar { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; justify-content:center; }
  input[type=search] { flex:1 1 200px; max-width:340px; padding:10px 14px; border-radius:12px;
    border:1px solid var(--edge); background:var(--card); color:var(--txt); font-size:1rem; outline:none; }
  .chip { padding:10px 16px; border-radius:12px; border:1px solid var(--edge); background:var(--card);
    color:var(--txt); font-size:.9rem; cursor:pointer; user-select:none; }
  .chip.on { background:var(--gold); color:#111; border-color:var(--gold); font-weight:700; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; padding:14px; }
  .duck { background:var(--card); border:1px solid var(--edge); border-radius:16px; overflow:hidden;
    text-align:center; transition:transform .15s; }
  .duck:active { transform:scale(.96); }
  .duck img { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:#0e1226; }
  .duck .nm { padding:8px 4px 10px; font-weight:700; font-size:.85rem; text-transform:capitalize; }
  .duck.sh .nm::after { content:" ✨"; }
  .duck.vet .nm { color:var(--gold); }
  #empty { text-align:center; padding:60px 20px; color:#9aa3c0; display:none; }
  #viewer { position:fixed; inset:0; background:rgba(5,7,15,.94); display:none; z-index:20;
    flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:20px; }
  #viewer img { max-width:92vw; max-height:70vh; border-radius:20px; border:2px solid var(--edge); }
  #viewer .nm { font-size:1.4rem; font-weight:800; text-transform:capitalize; }
  #viewer .btns { display:flex; gap:10px; }

#grid .dcard{width:100%;border-radius:14px}





.dwrap{perspective:1000px;width:min(88vw,420px);touch-action:pan-y;
 padding:14% 12% 12%;margin:-14% -12% -12%}
/* 3D stage — the card and the pop-out share this space but the orb is NOT clipped */
.dscene{position:relative;width:100%;aspect-ratio:5/7;transform-style:preserve-3d;
 transform:rotateY(calc(var(--tx,0)*13deg)) rotateX(calc(var(--ty,0)*-10deg));
 will-change:transform}
.dcard{position:relative;width:100%;height:100%;border-radius:20px;overflow:hidden;
 background:#0c0f1b;isolation:isolate;
 box-shadow:0 16px 46px rgba(0,0,0,.7)}
.dart{position:absolute;left:5.5%;right:5.5%;top:9%;height:62%;border-radius:10px;
 overflow:hidden;border:2px solid #28325a}
.dart img{width:100%;height:100%;object-fit:cover;display:block;
 transform:scale(1.06) translate(calc(var(--tx,0)*-1.6%),calc(var(--ty,0)*-1.6%));
 will-change:transform}
.foilzone{position:relative;isolation:isolate;overflow:hidden;
 box-shadow:0 0 calc(7px + var(--neon,6px)) var(--gcol,#00fff2),
            0 0 calc(18px + var(--neon,6px)) rgba(255,67,224,.35)}
/* themed colour wash */
.foilzone::after{content:"";position:absolute;inset:0;pointer-events:none;
 mix-blend-mode:color-dodge;opacity:var(--foil,.6);
 background:var(--wash);
 background-size:340% 340%;filter:saturate(1.9) brightness(1.5);
 background-position:calc(50% + var(--tx,0)*54%) calc(50% + var(--ty,0)*54%)}
/* diamond lattice texture layer */
.foilzone .lattice{position:absolute;inset:0;pointer-events:none;z-index:2;
 mix-blend-mode:color-dodge;opacity:calc(var(--foil,.6)*.95);
 background:var(--pat);background-size:var(--patsize,22px) var(--patsize,22px);
 background-position:calc(var(--tx,0)*14px) calc(var(--ty,0)*14px);
 filter:saturate(1.7) brightness(1.5)}
.foilzone::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
 mix-blend-mode:screen;opacity:calc(var(--foil,.6)*.75);
 background:linear-gradient(100deg,transparent 41%,rgba(255,255,255,.95) 49%,
  rgba(150,255,255,.8) 53%,transparent 61%);
 background-size:300% 300%;
 background-position:calc(50% + var(--tx,0)*76%) calc(50% + var(--ty,0)*76%);
 animation:neonStreak calc(var(--shim,6s)) linear infinite}
@keyframes neonStreak{0%{transform:translateX(-13%)}100%{transform:translateX(13%)}}
.dframe{position:absolute;inset:0;border-radius:20px;pointer-events:none;
 border:var(--fw,8px) solid #151b31}
.dframe::after{content:"";position:absolute;inset:0;border-radius:13px;pointer-events:none;
 mix-blend-mode:color-dodge;opacity:calc(var(--foil,.6)*1.18);
 border:var(--fw,8px) solid transparent;
 background:var(--wash) border-box;
 background-size:340% 340%;filter:saturate(2.0) brightness(1.6);
 background-position:calc(50% + var(--tx,0)*54%) calc(50% + var(--ty,0)*54%);
 -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);
 -webkit-mask-composite:xor;mask-composite:exclude}
.dframe::before{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;
 box-shadow:0 0 calc(11px + var(--neon,6px)) var(--gcol,#00fff2),
            0 0 calc(28px + var(--neon,6px)*2) rgba(255,67,224,.35),
            inset 0 0 calc(9px + var(--neon,6px)) rgba(130,255,255,.32);
 animation:neonPulse calc(var(--shim,6s)*.85) ease-in-out infinite}
@keyframes neonPulse{0%,100%{opacity:.7}50%{opacity:1}}

/* ============ POP-OUT ENERGY ORB (floats in front of the card) ============ */
.popout{position:absolute;left:50%;top:30%;width:38%;aspect-ratio:1;
 margin-left:-19%;pointer-events:none;transform-style:preserve-3d;
 transform:translateZ(var(--pz,86px)) translate(calc(var(--tx,0)*-9%),calc(var(--ty,0)*-9%));
 will-change:transform}
.orb{position:absolute;inset:0;animation:orbFloat var(--ocyc,4.6s) ease-in-out infinite}
.orb i{position:absolute;border-radius:50%;display:block}
/* molten core */
.orb .core{inset:26%;background:radial-gradient(circle at 38% 34%,#ffffff 0%,
 var(--o1) 34%,var(--o2) 66%,transparent 78%);
 filter:blur(1px) saturate(1.7) brightness(1.35);
 box-shadow:0 0 26px var(--o1),0 0 60px var(--o2),0 0 100px var(--o3);
 animation:orbPulse var(--ocyc,4.6s) ease-in-out infinite}
/* swirling energy shell */
.orb .shell{inset:10%;
 background:conic-gradient(from 0deg,transparent,var(--o1),transparent 28%,
  var(--o2),transparent 56%,var(--o3),transparent 84%,var(--o1));
 filter:blur(5px) saturate(1.8);opacity:.9;
 animation:orbSpin calc(var(--ocyc,4.6s)*1.6) linear infinite}
.orb .shell2{inset:2%;
 background:conic-gradient(from 180deg,transparent,var(--o3),transparent 34%,
  var(--o1),transparent 70%,var(--o2),transparent);
 filter:blur(9px) saturate(1.6);opacity:.65;
 animation:orbSpin calc(var(--ocyc,4.6s)*2.3) linear infinite reverse}
/* outer aura */
.orb .aura{inset:-22%;background:radial-gradient(circle,var(--o2) 0%,transparent 62%);
 filter:blur(13px);opacity:.5;
 animation:orbPulse calc(var(--ocyc,4.6s)*.8) ease-in-out infinite}
/* orbiting motes */
.orb .ring{position:absolute;inset:-6%;animation:orbSpin calc(var(--ocyc,4.6s)*1.15) linear infinite}
.orb .ring.r2{inset:-16%;animation-duration:calc(var(--ocyc,4.6s)*1.9);animation-direction:reverse}
.orb .mote{position:absolute;width:6%;aspect-ratio:1;border-radius:50%;
 background:#fff;box-shadow:0 0 9px var(--o1),0 0 16px var(--o2)}
/* shadow the orb casts back onto the card = sells the depth */
.podrop{position:absolute;left:50%;top:34%;width:34%;aspect-ratio:1;margin-left:-17%;
 border-radius:50%;background:rgba(0,0,0,.55);filter:blur(14px);
 transform:translateZ(1px) translate(calc(var(--tx,0)*6%),calc(var(--ty,0)*6%)) scale(.94);
 pointer-events:none;animation:orbFloat var(--ocyc,4.6s) ease-in-out infinite}
@keyframes orbFloat{0%,100%{translate:0 0}50%{translate:0 -7%}}
@keyframes orbPulse{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.13);opacity:1}}
@keyframes orbSpin{0%{rotate:0deg}100%{rotate:360deg}}
/* periodic energy burst */
.orb .burst{inset:14%;border:2px solid var(--o1);opacity:0;
 animation:orbBurst calc(var(--ocyc,4.6s)*2) ease-out infinite}
@keyframes orbBurst{0%{opacity:0;transform:scale(.6)}
 12%{opacity:.85}45%{opacity:0;transform:scale(2.3)}100%{opacity:0;transform:scale(2.3)}}
.dname{position:absolute;left:5.5%;right:5.5%;top:2.4%;height:5.6%;border-radius:9px;
 background:#131931;display:flex;align-items:center;justify-content:center;
 font:800 clamp(.8rem,4.2vw,1.28rem)/1 system-ui,sans-serif;color:#fff;
 text-transform:uppercase;letter-spacing:.06em;border:2px solid #2c3660}
.dstats{position:absolute;left:5.5%;right:5.5%;top:73%;height:7%;border-radius:9px;
 background:#121730;display:flex;align-items:center;justify-content:space-around;
 font:800 clamp(.68rem,3.4vw,1rem)/1 system-ui,sans-serif;color:#e3e9ff;
 border:2px solid #283260}
.dstars{position:absolute;left:5.5%;top:81.4%;height:5.4%;padding:0 12px;border-radius:9px;
 background:#121730;display:flex;align-items:center;
 font:800 clamp(.72rem,3.5vw,1.05rem)/1 system-ui,sans-serif;color:#ffdc80;
 letter-spacing:.13em;border:2px solid #283260}
.dmove{position:absolute;left:5.5%;right:5.5%;top:88%;height:8.6%;border-radius:9px;
 background:#101527;padding:6px 11px;border:2px solid #283260;
 display:flex;flex-direction:column;justify-content:center;gap:3px}
.dmove b{font:800 clamp(.66rem,3.2vw,.96rem)/1 system-ui,sans-serif;color:#fff}
.dmove span{font:600 clamp(.6rem,2.9vw,.86rem)/1 system-ui,sans-serif;color:#ffdc80}

#grid .dwrap{width:100%}
#grid .dcard{border-radius:12px}
</style>

<body>
<header>
  <h1>🦆 DUCK GALLERY <span>4</span></h1>
  <div id="count">loading the pond...</div>
  <div class="bar">
    <input type="search" id="q" placeholder="Search ducks...">
    <div class="chip on" data-f="all">All</div>
    <div class="chip" data-f="vet">Originals</div>
    <div class="chip" data-f="new">New Era</div>
    <div class="chip" id="shinyChip">✨ Shiny</div>
    <div class="chip on" id="liveChip">🎬 Live</div><div class="chip" onclick="enableGyro();this.classList.add('on')">📱 Tilt</div>
  </div>
  <div style="padding:0 14px 12px">
    <a href="game.html" style="display:block;text-align:center;text-decoration:none;
      background:linear-gradient(96deg,#00fff2,#3dff9e 48%,#ffd83d);color:#06070d;
      border-radius:14px;padding:13px;font:800 .92rem/1 system-ui;letter-spacing:.06em;
      text-transform:uppercase">🎮 Open the game — rip packs</a>
  </div>
</header>
<div id="grid"></div>
<div id="empty">No ducks match — try another search 🔍</div>
<div id="viewer">
  <div id="vHolder"></div>
  <div class="nm" id="vNm"></div>
  <div class="btns">
    <div class="chip" id="vToggle">✨ Shiny</div>
    <div class="chip" id="vClose">Close ✕</div>
  </div>
</div>
<script>

(function(){
  var DRAGGING = false;      // finger wins: gyro ignored while dragging
  var cards = [];

  function reg(wrap, card){
    var o = {wrap:wrap, card:card, tx:0, ty:0, gx:0, gy:0};
    cards.push(o);
    return o;
  }

  // one shared animation loop = buttery smooth on every card
  function loop(){
    for (var i=0;i<cards.length;i++){
      var o = cards[i];
      // ease toward target (higher = snappier, lower = smoother)
      o.tx += (o.gx - o.tx) * 0.16;
      o.ty += (o.gy - o.ty) * 0.16;
      if (Math.abs(o.gx-o.tx) < 0.0006) o.tx = o.gx;
      if (Math.abs(o.gy-o.ty) < 0.0006) o.ty = o.gy;
      o.card.style.setProperty('--tx', o.tx.toFixed(4));
      o.card.style.setProperty('--ty', o.ty.toFixed(4));
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  window.bindTilt = function(wrap){
    if (wrap.dataset.tilt) return;
    wrap.dataset.tilt = "1";
    var card = wrap.querySelector('.dscene') || wrap.querySelector('.dcard');
    if (!card) return;
    var o = reg(wrap, card);
    var down = false;

    function target(x, y){
      o.gx = Math.max(-1, Math.min(1, x));
      o.gy = Math.max(-1, Math.min(1, y));
    }
    function fromEvent(e){
      var r = wrap.getBoundingClientRect();
      target(((e.clientX-r.left)/r.width-0.5)*2, ((e.clientY-r.top)/r.height-0.5)*2);
    }
    wrap.addEventListener('pointerdown', function(e){
      down = true; DRAGGING = true;
      try { wrap.setPointerCapture(e.pointerId); } catch(_){}
      fromEvent(e);
      e.preventDefault();
    }, {passive:false});
    wrap.addEventListener('pointermove', function(e){
      if (down) { fromEvent(e); e.preventDefault(); }
      else if (e.pointerType === 'mouse') fromEvent(e);
    }, {passive:false});
    function release(){
      if (!down) return;
      down = false; DRAGGING = false;
      target(0, 0);            // glide back to rest
    }
    wrap.addEventListener('pointerup', release);
    wrap.addEventListener('pointercancel', release);
    wrap.addEventListener('pointerleave', function(e){
      if (!down && e.pointerType === 'mouse') target(0,0);
    });
    o.setGyro = function(x, y){ if (!DRAGGING && !down) target(x, y); };
  };

  window.enableGyro = function(){
    function handle(ev){
      if (DRAGGING) return;                     // finger always wins
      var g = (ev.gamma||0)/30, b = ((ev.beta||0)-42)/30;
      for (var i=0;i<cards.length;i++){
        if (cards[i].setGyro) cards[i].setGyro(g, b);
      }
    }
    function start(){ window.addEventListener('deviceorientation', handle); }
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission){
      DeviceOrientationEvent.requestPermission().then(function(s){ if (s==='granted') start(); });
    } else { start(); }
    return true;
  };
})();



(function(){
  function bind(wrap){
    if(wrap.dataset.tilt) return; wrap.dataset.tilt="1";
    var card=wrap.querySelector('.dcard'); if(!card) return;
    function set(x,y){
      card.style.setProperty('--tx',Math.max(-1,Math.min(1,x)).toFixed(3));
      card.style.setProperty('--ty',Math.max(-1,Math.min(1,y)).toFixed(3));
    }
    var dragging=false;
    wrap.addEventListener('pointerdown',function(e){dragging=true;wrap.setPointerCapture(e.pointerId);});
    wrap.addEventListener('pointerup',function(){dragging=false;set(0,0);});
    wrap.addEventListener('pointercancel',function(){dragging=false;set(0,0);});
    wrap.addEventListener('pointermove',function(e){
      var r=wrap.getBoundingClientRect();
      var x=((e.clientX-r.left)/r.width-.5)*2, y=((e.clientY-r.top)/r.height-.5)*2;
      if(dragging||e.pointerType==='mouse') set(x,y);
    });
    wrap._tiltSet=set;
  }
  window.bindTilt=bind;
  var gyroOn=false;
  window.enableGyro=function(){
    function handle(ev){
      var g=(ev.gamma||0)/32, b=((ev.beta||0)-42)/32;
      document.querySelectorAll('.dwrap').forEach(function(w){ if(w._tiltSet) w._tiltSet(g,b); });
    }
    function start(){ window.addEventListener('deviceorientation',handle); gyroOn=true; }
    if(typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission){
      DeviceOrientationEvent.requestPermission().then(function(s){ if(s==='granted') start(); });
    } else { start(); }
    return true;
  };
})();


const VETERANS = new Set(("alpha antimatter aurora bio breeze bufflehead canvasback chaos colony comet crystal current cyber dragon dream eagle earth echo eclipse elemental entropy fibonacci fire flare fractal frost fusion ghost glow gravity hive ice infinity isotope light magnet mallard mandarin metal meteor mudbog nebula neon nightmare nova omega order phantom pintail plasma prime prism quake quantum radiation rain rubber seed shadow shock singularity soul spore static stellar storm teal thorn tide void vortex waking wind woodduck zen arroyo bandit basecamp butte buzzard cactus campfire canyon compass coyote crawler daybreak dune gravel lantern lasso mesa mirage oasis outlaw overland prospector rattler ridgeline rockhopper rodeo saddle sandstorm scorpion sheriff snorkel spur summit sundown switchback trailboss tumbleweed winch wrangler").split(" "));
let ducks = [], filter = "all", shiny = false, live = true, current = null;

async function load() {
  try {
    const r = await fetch("cards/ducks/manifest.json?t=" + Date.now());
    const j = await r.json();
    ducks = j.ducks || [];
  } catch (e) { ducks = []; }
  render();
}


function buildCard(d, big) {
  const r = d.rarity;
  const foil = (0.40 + r * 0.13).toFixed(2), fw = 6 + r;
  const neon = 3 + r * 3, shim = (7.2 - r * 0.75).toFixed(2);
  const stars = "\u2605".repeat(r) + "\u2606".repeat(5 - r);
  const wrap = document.createElement("div");
  wrap.className = "dwrap";
  if (big) wrap.style.width = "min(92vw,420px)";
  const FOILPAL = {
  cosmic:["#3a28a0","#7850ff","#c896ff","#ffffff","#5ab4ff","#a06eff","#283cb4"],
  fire:["#ff5a14","#ff9628","#ffd65a","#ffffdc","#dc321e","#ff783c","#b42814"],
  ice:["#b4f0ff","#ffffff","#8cd2ff","#d2ebff","#6eb4f0","#e6faff","#5aa0dc"],
  storm:["#fff078","#ffffff","#78c8ff","#ffe650","#508cf0","#dcf0ff","#ffd23c"],
  leaf:["#5adc6e","#b4ff8c","#f0ffc8","#3cb478","#c8f078","#78ffb4","#32965a"],
  water:["#3cbeff","#8ce6ff","#ffffff","#288cdc","#6efff0","#b4f0ff","#1e6ebe"],
  music:["#ff78dc","#ffbef0","#ffffff","#ff5aaa","#ffd778","#e68cff","#c83ca0"],
  calm:["#00fff2","#63f7ff","#ffffff","#ff43e0","#ffd83d","#3dff9e","#00c3ff"]
};
const PATSIZE = {diamond:22,honeycomb:26,shatter:18,starburst:140,prism:14,linear:24};
function foilFor(d){
  const pal = FOILPAL[d.theme] || FOILPAL.calm;
  const pats = ["diamond","diamond","diamond","diamond","diamond",
                "honeycomb","honeycomb","shatter","shatter","starburst","prism","linear"];
  let hsh = 0; for (let i=0;i<d.name.length;i++) hsh = (hsh*31 + d.name.charCodeAt(i)) >>> 0;
  const pat = pats[hsh % pats.length];
  const stops = pal.map((c,i)=>`${c} ${12 + Math.round(i*(76/(pal.length-1)))}%`).join(",");
  const wash = `linear-gradient(115deg,transparent 4%,${stops},transparent 96%)`;
  const a=pal[0], b=pal[2], w=pal[3];
  let patt;
  if (pat==="diamond") patt = `repeating-linear-gradient(45deg,${a} 0 1px,transparent 1px 11px),repeating-linear-gradient(-45deg,${b} 0 1px,transparent 1px 11px)`;
  else if (pat==="honeycomb") patt = `repeating-linear-gradient(60deg,${a} 0 1px,transparent 1px 13px),repeating-linear-gradient(-60deg,${b} 0 1px,transparent 1px 13px),repeating-linear-gradient(0deg,${w} 0 1px,transparent 1px 13px)`;
  else if (pat==="shatter") patt = `repeating-linear-gradient(28deg,${a} 0 1px,transparent 1px 9px),repeating-linear-gradient(-67deg,${b} 0 1px,transparent 1px 15px)`;
  else if (pat==="starburst") patt = `repeating-conic-gradient(${a} 0deg 3deg,transparent 3deg 9deg)`;
  else if (pat==="prism") patt = `repeating-linear-gradient(72deg,${a} 0 1px,transparent 1px 5px)`;
  else patt = `repeating-linear-gradient(115deg,${a} 0 2px,transparent 2px 12px)`;
  return {wash, patt, size:PATSIZE[pat]};
}
  const F = foilFor(d);
  const L = '<i class="lattice"></i>';
  const pal = FOILPAL[d.theme] || FOILPAL.calm;
  const o1 = pal[1], o2 = pal[0], o3 = pal[2];
  const ocyc = (4.0 + (r % 4) * 0.4).toFixed(2);
  const pz = 62 + r * 12;
  let motes = "", motes2 = "";
  for (let k=0;k<4;k++){
    const a = k*90*Math.PI/180;
    motes += `<i class="mote" style="left:${(50+47*Math.cos(a)).toFixed(1)}%;top:${(50+47*Math.sin(a)).toFixed(1)}%"></i>`;
  }
  for (let k=0;k<3;k++){
    const a = (k*120+40)*Math.PI/180;
    motes2 += `<i class="mote" style="left:${(50+47*Math.cos(a)).toFixed(1)}%;top:${(50+47*Math.sin(a)).toFixed(1)}%"></i>`;
  }
  const ORB = `<div class="podrop"></div>` +
    `<div class="popout" style="--o1:${o1};--o2:${o2};--o3:${o3};--ocyc:${ocyc}s;--pz:${pz}px">` +
    `<div class="orb"><i class="aura"></i><i class="shell2"></i><i class="shell"></i>` +
    `<i class="core"></i><i class="burst"></i>` +
    `<div class="ring">${motes}</div><div class="ring r2">${motes2}</div></div></div>`;
  wrap.innerHTML =
    `<div class="dscene" style="--foil:${foil};--fw:${fw}px;--neon:${neon}px;--shim:${shim}s;--gcol:${d.glow};--wash:${F.wash};--pat:${F.patt};--patsize:${F.size}px">` +
    `<div class="dcard">` +
    `<div class="dart"><img loading="lazy" src="cards/ducks/${d.hero}" alt="${d.name}"></div>` +
    `<div class="dname foilzone">${L}${d.name}</div>` +
    `<div class="dstats foilzone">${L}<span>ATK ${d.atk}</span><span>DEF ${d.def}</span><span>SPD ${d.spd}</span></div>` +
    `<div class="dstars foilzone">${L}${stars}</div>` +
    `<div class="dmove foilzone">${L}<b>${d.icon} ${d.badge}</b><span>${d.move}</span></div>` +
    `<div class="dframe"></div></div>` + ORB + `</div>`;
  setTimeout(() => bindTilt(wrap), 0);
  return wrap;
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  let shown = 0;
  for (const d of ducks) {
    const vet = VETERANS.has(d.name);
    if (filter === "vet" && !vet) continue;
    if (filter === "new" && vet) continue;
    if (q && !d.name.includes(q)) continue;
    if (shiny && !d.shiny) continue;
    const el = document.createElement("div");
    el.className = "duck" + (vet ? " vet" : "") + (shiny ? " sh" : "");
    let img;
    if (true) {
      img = buildCard(d, false);
    } else {
      img = document.createElement("img");
      img.loading = "lazy";
      img.src = "cards/ducks/" + d.hero;
    }
    const nm = document.createElement("div");
    nm.className = "nm"; nm.textContent = d.name;
    el.append(img, nm);
    el.onclick = () => open(d);
    grid.appendChild(el);
    shown++;
  }
  document.getElementById("count").textContent = shown + " of " + ducks.length + " ducks in the pond";
  document.getElementById("empty").style.display = shown ? "none" : "block";
}

function open(d) {
  current = d;
  document.getElementById("vNm").textContent = d.name;
  setViewerImg(shiny);
  document.getElementById("viewer").style.display = "flex";
}
function setViewerImg(useShiny) {
  const holder = document.getElementById("vHolder");
  holder.innerHTML = "";
  if (current.hero) {
    holder.appendChild(buildCard(current, true));
  } else {
    const im = document.createElement("img");
    im.src = "cards/ducks/" + current.normal;
    im.style.maxWidth = "92vw"; im.style.maxHeight = "70vh";
    im.style.borderRadius = "20px";
    holder.appendChild(im);
  }
}
document.getElementById("vClose").onclick = () => document.getElementById("viewer").style.display = "none";
let vShiny = false;
document.getElementById("vToggle").onclick = () => { vShiny = !vShiny; setViewerImg(vShiny); };

document.getElementById("q").oninput = render;
document.querySelectorAll(".chip[data-f]").forEach(c => c.onclick = () => {
  document.querySelectorAll(".chip[data-f]").forEach(x => x.classList.remove("on"));
  c.classList.add("on"); filter = c.dataset.f; render();
});
document.getElementById("shinyChip").onclick = function () {
  shiny = !shiny; this.classList.toggle("on", shiny); render();
};
document.getElementById("liveChip").onclick = function () {
  live = !live; this.classList.toggle("on", live); render();
};
document.getElementById("liveChip").classList.add("on");
load();
setInterval(load, 30000); // new ducks appear automatically as they're created
</script>
</body>
</html>
