<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ducking Fun — Live Gallery 2</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D1B1F;--panel:#13262C;--tan:#E4CDA7;--orange:#E8722F;--gold:#F2C14E;--line:rgba(228,205,167,.14)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Rubik',sans-serif;background:var(--bg);color:var(--tan);min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(13,27,31,.97);border-bottom:1px solid var(--line);padding:12px 14px}
h1{font-family:'Bungee';font-size:19px}
h1 span{color:var(--orange)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6FBF73;margin-left:8px;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#bar{height:8px;background:var(--panel);border-radius:6px;margin-top:10px;overflow:hidden}
#fill{height:100%;width:0%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:6px;transition:width 1s}
#stats{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(228,205,167,.55);margin-top:7px}
#search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--tan);font-size:14px;outline:none;margin-top:10px}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px}
@media(min-width:560px){#grid{grid-template-columns:repeat(3,1fr)}}
.card{border-radius:16px;padding:3px;background:linear-gradient(135deg,#F2C14E,#B5811A,#F2C14E);box-shadow:0 8px 22px rgba(0,0,0,.45);animation:slidein .5s ease-out;position:relative}
@keyframes slidein{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
.inner{background:linear-gradient(180deg,#1A333B,#0D1B1F);border-radius:13px;overflow:hidden;padding-bottom:7px}
.inner img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#1E3941}
.nm{font-family:'Bungee';font-size:11.5px;text-align:center;padding:7px 6px 1px;color:#fff;line-height:1.15}
.mt{font-size:9px;text-align:center;color:rgba(228,205,167,.6)}
.new{position:absolute;top:8px;right:8px;background:var(--orange);color:#1A0E06;font-size:9px;font-weight:800;letter-spacing:1px;padding:3px 8px;border-radius:12px;z-index:2;animation:pulse 1.4s infinite}
#empty{text-align:center;padding:60px 30px;color:rgba(228,205,167,.5);font-size:14px;line-height:1.7}
#empty .big{font-size:44px;margin-bottom:10px}
#viewer{position:fixed;inset:0;z-index:50;background:rgba(6,12,14,.96);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#viewer.open{display:flex}
#viewer img{width:min(92vw,560px);border-radius:18px;border:3px solid var(--gold)}
#viewer .vn{font-family:'Bungee';font-size:18px;color:#fff;margin-top:14px}
#viewer .vm{font-size:12px;color:rgba(228,205,167,.65);margin-top:3px}
#viewer .close{margin-top:18px;background:var(--panel);border:1px solid var(--line);color:var(--tan);border-radius:14px;padding:12px 30px;font-family:'Bungee';font-size:13px}
</style>
</head>
<body>
<header>
  <h1>LIVE <span>GALLERY 2</span><span class="live"></span></h1>
  <div id="bar"><div id="fill"></div></div>

  <input id="search" placeholder="Search painted ducks...">
</header>

const BY_ID = {}; DUCKS.forEach(d=>BY_ID[d.i]=d);
const EMO = {water:'💧',fire:'🔥',earth:'🌿',wind:'💨',lightning:'⚡',ice:'❄️',light:'☀️',dark:'🌙',neutral:'⭐'};
const mtimes = {};     // id -> last seen mtime
let order = [];        // newest-painted first
const newest = new Set();
let totalDucks = DUCKS.length;

async function scan(){
  try{
    const res = await fetch('/list.json?t='+Date.now());
    const items = await res.json();  // [{id, m}]
    let changed = false;
    items.sort((a,b)=>a.m-b.m);      // oldest first so newest ends on top
    items.forEach(({id, m})=>{
      if(!(id in mtimes)){
        mtimes[id]=m; order.unshift(id); markNew(id); changed=true;
      } else if(m > mtimes[id]){
        mtimes[id]=m;
        order = order.filter(x=>x!==id); order.unshift(id);
        markNew(id); changed=true;
      }
    });
    if(changed) render();
    updateStats();
  }catch(e){}
}
function markNew(id){ newest.add(id); setTimeout(()=>{newest.delete(id); render();}, 90000); }

function updateStats(){
  const n = Object.keys(mtimes).length;
  document.getElementById('fill').style.width = Math.min(100, Math.round(n/totalDucks*100))+'%';
  document.getElementById('stats').textContent = n+' of '+totalDucks+' ducks on display · repaints pop to the top';
}

function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const grid = document.getElementById('grid');
  document.getElementById('empty').style.display = order.length ? 'none' : 'block';
  grid.innerHTML = '';
  order.forEach(id=>{
    const d = BY_ID[id] || {n:id, e:'neutral', s:'?'};
    if(q && !d.n.toLowerCase().includes(q) && !id.includes(q)) return;
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = (newest.has(id) ? '<span class="new">NEW</span>' : '') +
      `<div class="inner"><img loading="lazy" src="/cards/ducks/${id}_normal.png?t=${mtimes[id]}">` +
      `<div class="nm">${d.n}</div><div class="mt">${EMO[d.e]||''} ${d.e} · ${d.s}</div></div>`;
    el.onclick = ()=>{
      document.getElementById('vImg').src = '/cards/ducks/'+id+'_normal.png?t='+mtimes[id];
      document.getElementById('vName').textContent = d.n;
      document.getElementById('vMeta').textContent = (EMO[d.e]||'')+' '+d.e+' · '+d.s+' Series'+(d.a?' · '+d.a:'');
      document.getElementById('viewer').classList.add('open');
    };
    grid.appendChild(el);
  });
}
document.getElementById('search').oninput = render;
scan();
setInterval(scan, 8000);
</script>
